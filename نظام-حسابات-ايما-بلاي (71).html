function runCashFlow(){
  const selectedCash = getCheckedValues('cf-acc-item');
  let selectedCenters = getCheckedValues('cf-cc-item');
  const allowed = userAllowedCenters(currentUser);
  if(selectedCenters.length===0) selectedCenters = allowed.slice();
  selectedCenters = selectedCenters.filter(c=>allowed.includes(c));
  const from = document.getElementById('cf-from').value;
  const to = document.getElementById('cf-to').value || todayStr();
  const holder = document.getElementById('cf-result');

  if(selectedCash.length===0){
    holder.innerHTML = `<div class="card"><div class="empty-state"><div class="ic">💵</div>اختار حساب نقدية أو بنك واحد على الأقل.</div></div>`;
    return;
  }

  let beginningCash = 0;
  selectedCash.forEach(code=>{ beginningCash += computeOpeningBalance(code, selectedCenters, from || to); });
  if(!from){ beginningCash = 0; } // no meaningful "before" boundary without a start date

  const buckets = {'تشغيلية':{amount:0, rows:[]}, 'استثمارية':{amount:0, rows:[]}, 'تمويلية':{amount:0, rows:[]}};
  DB.entries.forEach(e=>{
    if(from && e.date<from) return;
    if(e.date>to) return;
    const cashDelta = e.lines
      .filter(l=>selectedCash.includes(l.account) && selectedCenters.includes(l.costCenter))
      .reduce((s,l)=>s+(l.debit-l.credit),0);
    if(Math.abs(cashDelta)<0.005) return;
    const counterLine = e.lines.find(l=>!selectedCash.includes(l.account));
    const counterAcc = counterLine ? accountByCode(counterLine.account) : null;
    const category = classifyCashFlowCategory(counterLine ? counterLine.account : null);
    buckets[category].amount += cashDelta;
    buckets[category].rows.push({entryNumber:e.entryNumber, date:e.date, counter: counterAcc?counterAcc.name:'-', amount:cashDelta, note:e.description||''});
  });
  const endingCash = beginningCash + buckets['تشغيلية'].amount + buckets['استثمارية'].amount + buckets['تمويلية'].amount;

  const excelRows = [];
  function sectionHTML(title, key, titleEn){
    const b = buckets[key];
    const displayTitle = currentLang==='ar' ? title : titleEn;
    const rowsHTML = b.rows.map(r=>{
      excelRows.push({'النشاط':title,'رقم القيد':r.entryNumber,'التاريخ':r.date,'الحساب المقابل':r.counter,'المبلغ':r.amount.toFixed(2),'البيان':r.note});
      return `<tr><td>${r.entryNumber}</td><td>${r.date}</td><td>${esc(r.counter)}</td><td class="num ${r.amount>=0?'debit':'credit'}">${fmtMoney(r.amount)}</td><td>${esc(r.note)}</td></tr>`;
    }).join('');
    return `
      <h4 style="font-size:13.5px;margin:16px 0 8px;">${displayTitle}</h4>
      <table class="data"><thead><tr><th>${tt('entryNumber')}</th><th>${tt('date')}</th><th>${tt('counterAccount')}</th><th>${currentLang==='ar'?'المبلغ':'Amount'}</th><th>${tt('note')}</th></tr></thead>
        <tbody>${rowsHTML || `<tr><td colspan="5" style="color:var(--muted);">${currentLang==='ar'?'لا يوجد':'None'}</td></tr>`}</tbody>
        <tfoot><tr><td colspan="3">${tt('netOf')} ${currentLang==='ar'?title:titleEn}</td><td class="num ${b.amount>=0?'debit':'credit'}">${fmtMoney(b.amount)}</td><td></td></tr></tfoot>
      </table>`;
  }

  holder.innerHTML = `
    <div class="card printable" id="cf-report-card">
      <h3><span class="n">💵</span> ${tt('cashFlowTitle')} ${from?`(${from} — ${to})`:`(${currentLang==='ar'?'حتى':'through'} ${to})`}</h3>
      ${sectionHTML('التشغيلية','تشغيلية', tt('operatingActivities'))}
      ${sectionHTML('الاستثمارية','استثمارية', tt('investingActivities'))}
      ${sectionHTML('التمويلية','تمويلية', tt('financingActivities'))}
      <div style="border-top:2px solid var(--ink);margin-top:16px;padding-top:10px;">
        <div style="display:flex;justify-content:space-between;padding:4px 0;"><span>${tt('beginningCash')}</span><span class="num">${fmtMoney(beginningCash)}</span></div>
        <div style="display:flex;justify-content:space-between;padding:4px 0;"><span>${tt('netChange')}</span><span class="num">${fmtMoney(endingCash-beginningCash)}</span></div>
        <div style="display:flex;justify-content:space-between;padding:4px 0;font-weight:800;font-size:15px;"><span>${tt('endingCash')}</span><span class="num">${fmtMoney(endingCash)}</span></div>
      </div>
      ${prepReviewFooterHTML(currentUser.username)}
      <div class="no-print" style="margin-top:14px;display:flex;gap:10px;flex-wrap:wrap;">
        ${currentUser.perms.print?`<button class="btn btn-ghost btn-sm" id="cf-preview">${tt('preview')}</button>
        <button class="btn btn-ghost btn-sm" id="cf-pdf">${tt('savePDF')}</button>`:''}
        <button class="btn btn-ghost btn-sm" id="cf-export">${tt('exportExcel')}</button>
      </div>
    </div>
  `;
  document.getElementById('cf-export').addEventListener('click',()=>{
    const rows = excelRows.concat([
      {'النشاط':'','رقم القيد':'','التاريخ':'','الحساب المقابل':'رصيد النقدية أول المدة','المبلغ':beginningCash.toFixed(2),'البيان':''},
      {'النشاط':'','رقم القيد':'','التاريخ':'','الحساب المقابل':'رصيد النقدية آخر المدة','المبلغ':endingCash.toFixed(2),'البيان':''},
    ]);
    const ws = XLSX.utils.json_to_sheet(rows);
    ws['!cols']=[{wch:12},{wch:10},{wch:12},{wch:22},{wch:14},{wch:26}];
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'التدفقات النقدية');
    XLSX.writeFile(wb, 'قائمة-التدفقات-النقدية.xlsx');
  });
  const previewBtn = document.getElementById('cf-preview');
  if(previewBtn) previewBtn.addEventListener('click', ()=>previewReportModal('cf-report-card', tt('cashFlowTitle')));
  const pdfBtn = document.getElementById('cf-pdf');
  if(pdfBtn) pdfBtn.addEventListener('click', ()=>exportElementToPDF(document.getElementById('cf-report-card'), 'قائمة-التدفقات-النقدية.pdf'));
}

/* =========================================================================
   VIEW: REVENUE & EXPENSES REPORT (تقرير الإيرادات والمصروفات)
   A per-branch cross-tab: one row per revenue/cost/expense account that has
   activity, one column per selected branch, plus a total column — built
   straight from each line's own account code and cost center, so it matches
   the real company template regardless of how many branches an entry spans.
========================================================================= */
function renderProfitReport(){
  const root = document.getElementById('view-root');
  root.innerHTML = `
    <div class="card no-print">
      <h3><span class="n">📊</span> ${currentLang==='ar'?'تقرير الإيرادات والمصروفات — اختر الفروع والفترة':'Revenue & Expenses Report — Choose Branches and Period'}</h3>
      <label style="font-size:12.5px;color:var(--muted);display:block;margin-bottom:5px;">${tt('branches')}</label>
      <input type="text" id="pr-cc-search" placeholder="${tt('searchBranch')}" style="width:100%;padding:8px 10px;border:1.5px solid var(--line);border-radius:8px;font-size:13px;margin-bottom:6px;">
      <div style="display:flex;gap:8px;margin-bottom:6px;">
        <button type="button" class="btn btn-ghost btn-sm" id="pr-cc-all">${tt('selectAll')}</button>
        <button type="button" class="btn btn-ghost btn-sm" id="pr-cc-clear">${tt('clearSelection')}</button>
      </div>
      <div id="pr-cc-list" style="max-height:220px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:8px 10px;">${costCenterCheckboxListHTML('pr', currentUser)}</div>
      <div class="grid grid-2" style="margin-top:14px;">
        <div class="field"><label>${tt('fromDate')}</label><input type="date" id="pr-from"></div>
        <div class="field"><label>${tt('toDate')}</label><input type="date" id="pr-to"></div>
      </div>
      <button class="btn btn-accent btn-sm" id="pr-run" style="margin-top:10px;">${currentLang==='ar'?'عرض التقرير':'Show Report'}</button>
      <p style="font-size:11px;color:var(--muted);margin-top:8px;">${currentLang==='ar'?'كل فرع مختار بيظهر عمود لوحده، وكل حساب إيرادات/تكلفة/مصروفات ليه حركة بيظهر سطر لوحده — بيحسب من فرع كل سطر لوحده، فبيشتغل صح حتى لو القيد الواحد موزّع على أكتر من فرع. رصيد المخزن ونظير الإدارة بتكتبهم إنت بإيدك.':'Each selected branch gets its own column, and every revenue/cost/expense account with activity gets its own row — calculated from each line\u2019s own cost center, so it works correctly even if one entry spans multiple branches. Inventory balance and management fee are entered manually.'}</p>
    </div>
    <div id="pr-result"></div>
  `;
  bindCheckboxListControls('pr');
  document.getElementById('pr-run').addEventListener('click', runProfitReport);
}
function runProfitReport(){
  let selectedCenters = getCheckedValues('pr-cc-item');
  const allowed = userAllowedCenters(currentUser);
  if(selectedCenters.length===0) selectedCenters = allowed.slice();
  selectedCenters = selectedCenters.filter(c=>allowed.includes(c)).sort();
  const from = document.getElementById('pr-from').value;
  const to = document.getElementById('pr-to').value;
  const holder = document.getElementById('pr-result');

  if(selectedCenters.length===0){
    holder.innerHTML = `<div class="card"><div class="empty-state"><div class="ic">📊</div>${currentLang==='ar'?'اختار فرع واحد على الأقل.':'Select at least one branch.'}</div></div>`;
    return;
  }

  function inRange(e){ return (!from || e.date>=from) && (!to || e.date<=to); }
  const isCostCode = code=>code.startsWith('4');        // تكلفة الخدمات والمبيعات
  const isExpenseOnlyCode = code=>code.startsWith('5'); // المصروفات التشغيلية

  // Build {accountCode: {name, perBranch:{code:amount}, total}} for a given classifier + sign
  function buildAccountMap(classifier, sign){
    const map = {};
    DB.entries.forEach(e=>{
      if(!inRange(e)) return;
      e.lines.forEach(l=>{
        if(!selectedCenters.includes(l.costCenter)) return;
        if(!classifier(l.account)) return;
        const acc = accountByCode(l.account);
        if(!acc || acc.type!=='تفصيلي') return;
        const amt = sign==='credit' ? (l.credit - l.debit) : (l.debit - l.credit);
        if(!map[l.account]) map[l.account] = {name:acc.name, perBranch:{}, total:0};
        map[l.account].perBranch[l.costCenter] = (map[l.account].perBranch[l.costCenter]||0) + amt;
        map[l.account].total += amt;
      });
    });
    return map;
  }
  const revenueMap = buildAccountMap(isRevenueCode, 'credit');
  const costMap = buildAccountMap(isCostCode, 'debit');
  const expenseMap = buildAccountMap(isExpenseOnlyCode, 'debit');

  const branchHeaderCells = selectedCenters.map(c=>`<th>${esc(costCenterByCode(c)?.name||c)}</th>`).join('')
    + `<th>${currentLang==='ar'?'الإجمالي':'Total'}</th>`;

  function sectionRowsAndTotals(map){
    const codes = Object.keys(map).sort();
    const colTotals = {}; selectedCenters.forEach(c=>colTotals[c]=0);
    let grand = 0;
    const rowsHtml = codes.map(code=>{
      const {name, perBranch, total} = map[code];
      grand += total;
      const cells = selectedCenters.map(c=>{ const v = perBranch[c]||0; colTotals[c]+=v; return `<td class="num">${fmtMoney(v)}</td>`; }).join('');
      return `<tr><td>${esc(name)}</td>${cells}<td class="num" style="font-weight:700;">${fmtMoney(total)}</td></tr>`;
    }).join('');
    return {rowsHtml, colTotals, grand, count:codes.length};
  }
  function totalsRow(label, colTotals, grand, extraStyle){
    const cells = selectedCenters.map(c=>`<td class="num" style="font-weight:800;">${fmtMoney(colTotals[c]||0)}</td>`).join('');
    return `<tr style="font-weight:800;${extraStyle||''}"><td>${label}</td>${cells}<td class="num" style="font-weight:800;">${fmtMoney(grand)}</td></tr>`;
  }

  const revSec = sectionRowsAndTotals(revenueMap);
  const costSec = sectionRowsAndTotals(costMap);
  const expSec = sectionRowsAndTotals(expenseMap);

  const grossPerCol = {}; selectedCenters.forEach(c=> grossPerCol[c] = (revSec.colTotals[c]||0) - (costSec.colTotals[c]||0));
  const grossTotal = revSec.grand - costSec.grand;
  const netPerCol = {}; selectedCenters.forEach(c=> netPerCol[c] = grossPerCol[c] - (expSec.colTotals[c]||0));
  const netTotal = grossTotal - expSec.grand;
  const managementFee = netTotal * 0.10;
  const netAfterFee = netTotal - managementFee;
  const colspan = selectedCenters.length + 1;

  holder.innerHTML = `
    <div class="card printable" id="pr-report-card">
      <h3><span class="n">📊</span> ${currentLang==='ar'?'تقرير الإيرادات والمصروفات':'Revenue & Expenses Report'} ${from||to?`(${from||''} — ${to||''})`:''}</h3>
      <div style="overflow:auto;">
        <table class="data">
          <thead><tr><th>${currentLang==='ar'?'البند':'Item'}</th>${branchHeaderCells}</tr></thead>
          <tbody>
            ${revSec.count>0?revSec.rowsHtml:`<tr><td colspan="${colspan+1}" style="color:var(--muted);">${currentLang==='ar'?'لا يوجد إيرادات في الفترة دي':'No revenue in this period'}</td></tr>`}
            ${totalsRow(currentLang==='ar'?'إجمالي المبيعات':'Total Sales', revSec.colTotals, revSec.grand)}
            ${costSec.count>0?costSec.rowsHtml:''}
            ${totalsRow(currentLang==='ar'?'يخصم: إجمالي التكلفة':'Less: Total Cost', costSec.colTotals, costSec.grand)}
            ${totalsRow(currentLang==='ar'?'مجمل ربح أو (خسارة) النشاط':'Gross Profit / (Loss)', grossPerCol, grossTotal, 'border-top:2px solid var(--ink);')}
            ${expSec.count>0?expSec.rowsHtml:''}
            ${totalsRow(currentLang==='ar'?'يخصم: إجمالي المصروفات':'Less: Total Expenses', expSec.colTotals, expSec.grand)}
            ${totalsRow(currentLang==='ar'?'صافي ربح (خسارة) النشاط':'Net Profit / (Loss)', netPerCol, netTotal, 'border-top:2px solid var(--ink);')}
            <tr><td colspan="${colspan}">${currentLang==='ar'?'نظير الإدارة 10%':'Management Fee 10%'}</td><td class="num"><input type="number" id="pr-mgmt-fee" value="${managementFee.toFixed(2)}" step="0.01" style="width:120px;padding:5px 8px;border:1.3px solid var(--line);border-radius:6px;text-align:left;direction:ltr;"></td></tr>
            <tr style="font-weight:800;border-top:1px solid var(--ink);"><td colspan="${colspan}">${currentLang==='ar'?'صافي الربح بعد نظير الإدارة':'Net Profit After Management Fee'}</td><td class="num" id="pr-net-after-fee">${fmtMoney(netAfterFee)}</td></tr>
            <tr><td colspan="${colspan}">${currentLang==='ar'?'رصيد المخزن':'Inventory Balance'}</td><td class="num"><input type="number" id="pr-inventory" value="0" step="0.01" style="width:120px;padding:5px 8px;border:1.3px solid var(--line);border-radius:6px;text-align:left;direction:ltr;"></td></tr>
            <tr style="font-weight:800;border-top:2px solid var(--ink);font-size:15px;"><td colspan="${colspan}">${currentLang==='ar'?'الصافي':'Net Total'}</td><td class="num" id="pr-final-net">${fmtMoney(netAfterFee)}</td></tr>
          </tbody>
        </table>
      </div>
      ${prepReviewFooterHTML(currentUser.username)}
      <div class="no-print" style="margin-top:14px;display:flex;gap:10px;flex-wrap:wrap;">
        ${currentUser.perms.print?`<button class="btn btn-ghost btn-sm" id="pr-preview">${tt('preview')}</button>
        <button class="btn btn-ghost btn-sm" id="pr-pdf">${tt('savePDF')}</button>`:''}
        <button class="btn btn-ghost btn-sm" id="pr-export">${tt('exportExcel')}</button>
      </div>
    </div>
  `;
  function recalcProfitReport(){
    const fee = parseFloat(document.getElementById('pr-mgmt-fee').value)||0;
    const inv = parseFloat(document.getElementById('pr-inventory').value)||0;
    const afterFee = netTotal - fee;
    const finalNet = afterFee + inv;
    const afterFeeEl = document.getElementById('pr-net-after-fee');
    afterFeeEl.textContent = fmtMoney(afterFee);
    afterFeeEl.className = afterFee>=0?'num':'num credit';
    const finalEl = document.getElementById('pr-final-net');
    finalEl.textContent = fmtMoney(finalNet);
    finalEl.className = finalNet>=0?'num':'num credit';
  }
  document.getElementById('pr-mgmt-fee').addEventListener('input', recalcProfitReport);
  document.getElementById('pr-inventory').addEventListener('input', recalcProfitReport);
  document.getElementById('pr-export').addEventListener('click',()=>{
    const fee = parseFloat(document.getElementById('pr-mgmt-fee').value)||0;
    const inv = parseFloat(document.getElementById('pr-inventory').value)||0;
    const afterFee = netTotal - fee;
    const branchNames = selectedCenters.map(c=>costCenterByCode(c)?.name||c);
    function sectionToRows(map, sectionLabel){
      return Object.keys(map).sort().map(code=>{
        const row = {'القسم':sectionLabel,'البند':map[code].name};
        selectedCenters.forEach((c,i)=>{ row[branchNames[i]] = (map[code].perBranch[c]||0).toFixed(2); });
        row['الإجمالي'] = map[code].total.toFixed(2);
        return row;
      });
    }
    const rows = [
      ...sectionToRows(revenueMap,'إيرادات'),
      ...sectionToRows(costMap,'تكلفة'),
      ...sectionToRows(expenseMap,'مصروفات'),
    ];
    const summaryRow = (label, val)=>{ const r={'القسم':'','البند':label}; selectedCenters.forEach(()=>{}); r['الإجمالي']=val.toFixed(2); return r; };
    rows.push(summaryRow('إجمالي المبيعات', revSec.grand));
    rows.push(summaryRow('إجمالي التكلفة', costSec.grand));
    rows.push(summaryRow('مجمل ربح/خسارة', grossTotal));
    rows.push(summaryRow('إجمالي المصروفات', expSec.grand));
    rows.push(summaryRow('صافي ربح/خسارة', netTotal));
    rows.push(summaryRow('نظير الإدارة', fee));
    rows.push(summaryRow('صافي بعد النظير', afterFee));
    rows.push(summaryRow('رصيد المخزن', inv));
    rows.push(summaryRow('الصافي', afterFee+inv));
    const ws = XLSX.utils.json_to_sheet(rows);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'تقرير الإيرادات والمصروفات');
    XLSX.writeFile(wb, 'تقرير-الإيرادات-والمصروفات.xlsx');
  });
  const previewBtn = document.getElementById('pr-preview');
  if(previewBtn) previewBtn.addEventListener('click', ()=>previewReportModal('pr-report-card', currentLang==='ar'?'تقرير الإيرادات والمصروفات':'Revenue & Expenses Report'));
  const pdfBtn = document.getElementById('pr-pdf');
  if(pdfBtn) pdfBtn.addEventListener('click', ()=>exportElementToPDF(document.getElementById('pr-report-card'), 'تقرير-الإيرادات-والمصروفات.pdf'));
}

/* =========================================================================

function renderCOA(){

    const indent = Math.max(0,(a.code.length-1))*14;

    const actions = currentUser.perms.addAccount ? `
      <button class="btn btn-ghost btn-sm" data-action="edit-account" data-code="${esc(a.code)}">تعديل</button>
      <button class="btn btn-danger btn-sm" data-action="delete-account" data-code="${esc(a.code)}">حذف</button>` : '';

      <td style="font-weight:${weight};">${esc(a.name)}</td><td>${a.nature}</td><td>${a.type}</td>

      <div class="grid grid-4">
        <div class="field"><label>رقم الحساب</label><input type="text" id="acc-code"></div>
        <div class="field"><label>اسم الحساب</label><input type="text" id="acc-name"></div>
        <div class="field"><label>طبيعة الحساب</label><select id="acc-nature"><option value="مدين">مدين</option><option value="دائن">دائن</option></select></div>
        <div class="field"><label>نوع الحساب</label><select id="acc-type">
          <option value="تفصيلي">تفصيلي (يقبل قيود)</option>
          <option value="عنوان">عنوان</option>
          <option value="مجموعة فرعية">مجموعة فرعية</option>
          <option value="مجموعة رئيسية">مجموعة رئيسية</option>
        </select></div>
      </div>
      <button class="btn btn-accent btn-sm" id="add-account-btn">حفظ الحساب</button>
    </div>` : ''}
    <div class="card">
      <h3><span class="n">🗂️</span> دليل الحسابات (${DB.coa.length} حساب)</h3>
      <div style="overflow:auto;max-height:600px;">
        <table class="data">
          <thead><tr><th>رقم الحساب</th><th>اسم الحساب</th><th>الطبيعة</th><th>النوع</th><th class="no-print">إجراءات</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
    </div>
    ${currentUser.perms.addAccount ? `
    <div class="card no-print">
      <h3><span class="n">➕</span> إضافة فرع / مركز تكلفة جديد</h3>
      <div class="grid grid-3">
        <div class="field"><label>كود الفرع</label><input type="text" id="branch-code" placeholder="مثال: 012"></div>
        <div class="field"><label>اسم الفرع</label><input type="text" id="branch-name" placeholder="اسم الفرع أو مركز التكلفة"></div>
      </div>
      <button class="btn btn-accent btn-sm" id="add-branch-btn">حفظ الفرع</button>
    </div>` : ''}
    <div class="card">
      <h3><span class="n">🏢</span> الفروع / مراكز التكلفة (${DB.costCenters.length})</h3>
      <div style="overflow:auto;max-height:400px;">
        <table class="data">
          <thead><tr><th>كود الفرع</th><th>اسم الفرع</th><th class="no-print">إجراءات</th></tr></thead>
          <tbody>${ccRows}</tbody>
        </table>
      </div>

      const code = document.getElementById('acc-code').value.trim();
      const name = document.getElementById('acc-name').value.trim();
      const nature = document.getElementById('acc-nature').value;
      const type = document.getElementById('acc-type').value;
      if(!code || !name){ showToast('اكتب رقم واسم الحساب'); return; }
      if(DB.coa.some(a=>a.code===code)){ showToast('رقم الحساب موجود بالفعل'); return; }
      DB.coa.push({code,name,nature,type});
      await saveCOA();
      showToast('اتضاف الحساب');
      renderCOA();
    });
    root.querySelectorAll('[data-action="edit-account"]').forEach(b=>{
      b.addEventListener('click', ()=>showEditAccountModal(b.dataset.code));
    });
    root.querySelectorAll('[data-action="delete-account"]').forEach(b=>{
      b.addEventListener('click', ()=>deleteAccount(b.dataset.code));
    });
  }
}
function showEditAccountModal(code){
  const acc = accountByCode(code);
  if(!acc) return;
  const holder = document.getElementById('account-modal-holder');
  holder.innerHTML = `
    <div class="modal-bg" id="acc-modal-bg">
      <div class="modal" style="max-width:420px;">
        <h3>تعديل حساب ${esc(acc.code)}</h3>
        <div class="field"><label>اسم الحساب</label><input type="text" id="edit-acc-name" value="${esc(acc.name)}"></div>
        <div class="field"><label>طبيعة الحساب</label><select id="edit-acc-nature">
          <option value="مدين" ${acc.nature==='مدين'?'selected':''}>مدين</option>
          <option value="دائن" ${acc.nature==='دائن'?'selected':''}>دائن</option>
        </select></div>
        <div class="field"><label>نوع الحساب</label><select id="edit-acc-type">
          <option value="تفصيلي" ${acc.type==='تفصيلي'?'selected':''}>تفصيلي (يقبل قيود)</option>
          <option value="عنوان" ${acc.type==='عنوان'?'selected':''}>عنوان</option>
          <option value="مجموعة فرعية" ${acc.type==='مجموعة فرعية'?'selected':''}>مجموعة فرعية</option>
          <option value="مجموعة رئيسية" ${acc.type==='مجموعة رئيسية'?'selected':''}>مجموعة رئيسية</option>
        </select></div>
        <p style="font-size:11.5px;color:var(--muted);">رقم الحساب نفسه ثابت ومينفعش يتغيّر عشان القيود القديمة مرتبطة بيه.</p>
        <div style="display:flex;gap:10px;margin-top:10px;">
          <button class="btn btn-accent btn-sm" id="edit-acc-save">💾 حفظ</button>
          <button class="btn btn-ghost btn-sm" id="edit-acc-cancel">إلغاء</button>
        </div>
      </div>
    </div>`;
  document.getElementById('edit-acc-cancel').addEventListener('click', ()=>holder.innerHTML='');
  document.getElementById('acc-modal-bg').addEventListener('click',(e)=>{ if(e.target.id==='acc-modal-bg') holder.innerHTML=''; });
  document.getElementById('edit-acc-save').addEventListener('click', async ()=>{
    const name = document.getElementById('edit-acc-name').value.trim();
    if(!name){ showToast('اكتب اسم الحساب'); return; }
    acc.name = name;
    acc.nature = document.getElementById('edit-acc-nature').value;
    acc.type = document.getElementById('edit-acc-type').value;
    await saveCOA();
    holder.innerHTML='';
    showToast('اتحفظ تعديل الحساب');
    renderCOA();
  });
}
async function deleteAccount(code){
  const usedInEntries = DB.entries.some(e=>e.lines.some(l=>l.account===code));
  if(usedInEntries){
    showToast('مينفعش تحذف الحساب ده، مستخدم بالفعل في قيود متسجلة');
    return;
  }
  const hasChildren = DB.coa.some(a=>a.code!==code && a.code.startsWith(code));
  if(hasChildren){
    showToast('الحساب ده أب لحسابات فرعية تانية، احذف الفرعية الأول');
    return;
  }
  if(!confirm('متأكد إنك عايز تحذف الحساب '+code+'؟')) return;
  DB.coa = DB.coa.filter(a=>a.code!==code);
  await saveCOA();
  showToast('اتحذف الحساب');
  renderCOA();
}
function showEditBranchModal(code){
  const cc = costCenterByCode(code);
  if(!cc) return;
  const holder = document.getElementById('branch-modal-holder');
  holder.innerHTML = `
    <div class="modal-bg" id="branch-modal-bg">
      <div class="modal" style="max-width:400px;">
        <h3>تعديل فرع ${esc(cc.code)}</h3>
        <div class="field"><label>اسم الفرع</label><input type="text" id="edit-branch-name" value="${esc(cc.name)}"></div>
        <p style="font-size:11.5px;color:var(--muted);">كود الفرع نفسه ثابت ومينفعش يتغيّر عشان القيود القديمة ومستخدمين النظام مرتبطين بيه.</p>
        <div style="display:flex;gap:10px;margin-top:10px;">
          <button class="btn btn-accent btn-sm" id="edit-branch-save">💾 حفظ</button>
          <button class="btn btn-ghost btn-sm" id="edit-branch-cancel">إلغاء</button>
        </div>
      </div>
    </div>`;
  document.getElementById('edit-branch-cancel').addEventListener('click', ()=>holder.innerHTML='');
  document.getElementById('branch-modal-bg').addEventListener('click',(e)=>{ if(e.target.id==='branch-modal-bg') holder.innerHTML=''; });
  document.getElementById('edit-branch-save').addEventListener('click', async ()=>{
    const name = document.getElementById('edit-branch-name').value.trim();
    if(!name){ showToast('اكتب اسم الفرع'); return; }
    cc.name = name;
    await saveCostCenters();
    holder.innerHTML='';
    showToast('اتحفظ تعديل الفرع');
    renderCOA();
  });
}
async function deleteBranch(code){
  const usedInEntries = DB.entries.some(e=>e.lines.some(l=>l.costCenter===code));
  if(usedInEntries){
    showToast('مينفعش تحذف الفرع ده، مستخدم بالفعل في قيود متسجلة');
    return;
  }
  const usedByUser = DB.users.some(u=>Array.isArray(u.allowedCostCenters) && u.allowedCostCenters.includes(code));
  if(usedByUser){
    showToast('مينفعش تحذف الفرع ده، متحدد كصلاحية لمستخدم واحد أو أكتر — شيله من صلاحياتهم الأول');
    return;
  }
  if(!confirm('متأكد إنك عايز تحذف الفرع '+code+'؟')) return;
  DB.costCenters = DB.costCenters.filter(c=>c.code!==code);
  await saveCostCenters();
  showToast('اتحذف الفرع');
  renderCOA();
}

/* =========================================================================
   VIEW: USER MANAGEMENT
========================================================================= */
function permsSummaryHTML(perms){
  const labels = {addEntry:'إضافة',editEntry:'تعديل',deleteEntry:'حذف',viewReports:'تقارير',manageUsers:'مستخدمين',print:'طباعة',addAccount:'حسابات'};
  return Object.keys(labels).map(k=>`<span class="perm-tag ${perms[k]?'':'off'}">${labels[k]}</span>`).join('');
}
function renderUsers(){
  const root = document.getElementById('view-root');
  const rows = DB.users.map(u=>{
    const centers = u.allowedCostCenters==='all' ? 'كل الفروع' : u.allowedCostCenters.map(c=>costCenterByCode(c)?.name||c).join('، ');
    return `<tr>
      <td>${esc(u.username)}</td>
      <td><span class="badge-role">${esc(u.role)}</span></td>
      <td style="font-size:12px;">${esc(centers)}</td>
      <td>${permsSummaryHTML(u.perms)}</td>
      <td>
        <button class="btn btn-ghost btn-sm" data-action="edit-user" data-username="${esc(u.username)}">تعديل</button>
        <button class="btn btn-danger btn-sm" data-action="delete-user" data-username="${esc(u.username)}">حذف</button>
      </td>
    </tr>`;
  }).join('');

  root.innerHTML = `
    <div class="card no-print">
      <h3><span class="n">➕</span> إضافة / تعديل مستخدم</h3>
      <form id="user-form">
        <input type="hidden" id="u-original-username">
        <div class="grid grid-3">
          <div class="field"><label>اسم المستخدم</label><input type="text" id="u-username" required></div>
          <div class="field"><label>كلمة المرور</label><input type="text" id="u-password" required></div>
          <div class="field"><label>الدور / المسمى</label><input type="text" id="u-role" required placeholder="مثال: محاسب"></div>
        </div>
        <fieldset style="margin-top:10px;">
          <legend>الفروع المسموح بها</legend>
          <div class="checkbox-row"><input type="checkbox" id="u-cc-all"><label for="u-cc-all">كل الفروع</label></div>
          <div class="grid grid-3" id="u-cc-list">
            ${DB.costCenters.map(c=>`<div class="checkbox-row"><input type="checkbox" class="u-cc-item" value="${c.code}" id="ucc-${c.code}"><label for="ucc-${c.code}">${c.code} - ${esc(c.name)}</label></div>`).join('')}
          </div>
        </fieldset>
        <fieldset style="margin-top:10px;">
          <legend>الصلاحيات</legend>
          <div class="grid grid-4">
            <div class="checkbox-row"><input type="checkbox" class="u-perm" id="p-addEntry"><label for="p-addEntry">إضافة قيود</label></div>
            <div class="checkbox-row"><input type="checkbox" class="u-perm" id="p-editEntry"><label for="p-editEntry">تعديل قيود</label></div>
            <div class="checkbox-row"><input type="checkbox" class="u-perm" id="p-deleteEntry"><label for="p-deleteEntry">حذف قيود</label></div>
            <div class="checkbox-row"><input type="checkbox" class="u-perm" id="p-viewReports"><label for="p-viewReports">عرض التقارير</label></div>
            <div class="checkbox-row"><input type="checkbox" class="u-perm" id="p-manageUsers"><label for="p-manageUsers">إدارة المستخدمين</label></div>
            <div class="checkbox-row"><input type="checkbox" class="u-perm" id="p-print"><label for="p-print">طباعة</label></div>
            <div class="checkbox-row"><input type="checkbox" class="u-perm" id="p-addAccount"><label for="p-addAccount">إضافة حساب</label></div>
          </div>
        </fieldset>
        <div style="margin-top:14px;display:flex;gap:10px;">
          <button type="submit" class="btn btn-accent">💾 حفظ المستخدم</button>
          <button type="button" class="btn btn-ghost" id="user-form-reset">تفريغ</button>
        </div>
      </form>
    </div>
    <div class="card">
      <h3><span class="n">👥</span> المستخدمين (${DB.users.length})</h3>
      <div style="overflow:auto;">
        <table class="data">
          <thead><tr><th>اسم المستخدم</th><th>الدور</th><th>الفروع</th><th>الصلاحيات</th><th>إجراءات</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
    </div>
    <div class="card">
      <h3><span class="n">📜</span> سجل تغييرات المستخدمين (${DB.auditLog.length})</h3>
      <div class="no-print" style="margin-bottom:12px;">
        <button class="btn btn-ghost btn-sm" id="audit-export">⬇️ تصدير Excel</button>
      </div>
      <div style="overflow:auto;max-height:400px;">
        <table class="data">
          <thead><tr><th>الوقت</th><th>المستخدم المتأثر</th><th>الإجراء</th><th>التفاصيل</th><th>بواسطة</th></tr></thead>
          <tbody>${
            DB.auditLog.length===0
              ? `<tr><td colspan="5" style="color:var(--muted);text-align:center;">لا يوجد تعديلات مسجّلة لسه</td></tr>`
              : [...DB.auditLog].reverse().map(a=>`<tr>
                  <td>${new Date(a.ts).toLocaleString('ar-EG')}</td>
                  <td>${esc(a.username)}</td>
                  <td>${esc(a.action)}</td>
                  <td style="font-size:12px;color:var(--muted);">${esc(a.details)}</td>
                  <td>${esc(a.by)}</td>
                </tr>`).join('')
          }</tbody>
        </table>
      </div>
    </div>
  `;
  document.getElementById('audit-export').addEventListener('click', ()=>{
    if(DB.auditLog.length===0){ showToast('مفيش سجل تعديلات للتصدير'); return; }
    const rows2 = [...DB.auditLog].reverse().map(a=>({
      'الوقت': new Date(a.ts).toLocaleString('ar-EG'),
      'المستخدم المتأثر': a.username, 'الإجراء': a.action, 'التفاصيل': a.details, 'بواسطة': a.by
    }));
    const ws = XLSX.utils.json_to_sheet(rows2);
    ws['!cols'] = [{wch:20},{wch:16},{wch:28},{wch:40},{wch:16}];
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'سجل التعديلات');
    XLSX.writeFile(wb, 'سجل-تغييرات-المستخدمين.xlsx');
  });

  document.getElementById('u-cc-all').addEventListener('change', function(){
    document.querySelectorAll('.u-cc-item').forEach(cb=>{ cb.disabled = this.checked; if(this.checked) cb.checked=false; });
  });
  document.getElementById('user-form-reset').addEventListener('click', renderUsers);
  document.getElementById('user-form').addEventListener('submit', async function(e){
    e.preventDefault();
    const original = document.getElementById('u-original-username').value;
    const username = document.getElementById('u-username').value.trim();
    const password = document.getElementById('u-password').value;
    const role = document.getElementById('u-role').value.trim();
    const allAll = document.getElementById('u-cc-all').checked;
    const selectedCC = Array.from(document.querySelectorAll('.u-cc-item:checked')).map(cb=>cb.value);
    if(!username || !password || !role){ showToast('اكمل بيانات المستخدم'); return; }
    if(!allAll && selectedCC.length===0){ showToast('اختار فرع واحد على الأقل أو كل الفروع'); return; }
    if(!original && DB.users.some(u=>u.username===username)){ showToast('اسم المستخدم ده موجود بالفعل'); return; }
    const perms = {
      addEntry: document.getElementById('p-addEntry').checked,
      editEntry: document.getElementById('p-editEntry').checked,
      deleteEntry: document.getElementById('p-deleteEntry').checked,
      viewReports: document.getElementById('p-viewReports').checked,
      manageUsers: document.getElementById('p-manageUsers').checked,
      print: document.getElementById('p-print').checked,
      addAccount: document.getElementById('p-addAccount').checked,
    };
    const newUserObj = {username,password,role,allowedCostCenters: allAll?'all':selectedCC, perms};
    let auditDetails = '';
    if(original){
      const idx = DB.users.findIndex(u=>u.username===original);
      if(idx>-1){
        const existing = DB.users[idx];
        const passwordChanged = existing.password !== password;
        newUserObj.forceChange = passwordChanged ? true : existing.forceChange;
        newUserObj.securityQuestion = existing.securityQuestion || null;
        newUserObj.securityAnswer = passwordChanged ? null : (existing.securityAnswer || null);
        const changes = [];
        if(existing.username!==username) changes.push(`الاسم: ${existing.username} ← ${username}`);
        if(passwordChanged) changes.push('تم تغيير كلمة السر (هيتطلب منه يعمل استكمال بيانات تاني)');
        if(existing.role!==role) changes.push(`الدور: ${existing.role} ← ${role}`);
        if(JSON.stringify(existing.perms)!==JSON.stringify(perms)) changes.push('تم تعديل الصلاحيات');
        if(JSON.stringify(existing.allowedCostCenters)!==JSON.stringify(newUserObj.allowedCostCenters)) changes.push('تم تعديل الفروع المسموح بها');
        auditDetails = changes.length ? changes.join(' — ') : 'لا يوجد تغيير فعلي';
        DB.users[idx]=newUserObj;
      }
      if(currentUser.username===original) currentUser = newUserObj;
    }else{
      newUserObj.forceChange = true;
      newUserObj.securityQuestion = null;
      newUserObj.securityAnswer = null;
      DB.users.push(newUserObj);
      auditDetails = `تم إنشاء مستخدم جديد بالدور: ${role}`;
    }
    await saveUsers();
    await logAudit(username, original?'تعديل بيانات مستخدم بواسطة الأدمن':'إضافة مستخدم جديد بواسطة الأدمن', auditDetails, currentUser.username);
    showToast(original ? 'اتحفظ المستخدم' : 'اتضاف المستخدم — هيتطلب منه يغيّر بياناته وكلمة المرور أول ما يدخل');
    setupSidebarForUser();
    renderUsers();
  });

  root.querySelectorAll('[data-action="edit-user"]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const u = DB.users.find(x=>x.username===btn.dataset.username);
      if(!u) return;
      document.getElementById('u-original-username').value = u.username;
      document.getElementById('u-username').value = u.username;
      document.getElementById('u-password').value = u.password;
      document.getElementById('u-role').value = u.role;
      const allAll = u.allowedCostCenters==='all';
      document.getElementById('u-cc-all').checked = allAll;
      document.querySelectorAll('.u-cc-item').forEach(cb=>{
        cb.disabled = allAll;
        cb.checked = !allAll && u.allowedCostCenters.includes(cb.value);
      });
      Object.keys(u.perms).forEach(k=>{
        const el = document.getElementById('p-'+k);
        if(el) el.checked = u.perms[k];
      });
      window.scrollTo({top:0,behavior:'smooth'});
    });
  });
  root.querySelectorAll('[data-action="delete-user"]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const uname = btn.dataset.username;
      if(uname===currentUser.username){ showToast('مينفعش تحذف حسابك وانت داخل بيه'); return; }
      const managers = DB.users.filter(u=>u.perms.manageUsers);
      const target = DB.users.find(u=>u.username===uname);
      if(target.perms.manageUsers && managers.length<=1){ showToast('لازم يفضل مستخدم واحد على الأقل بصلاحية إدارة المستخدمين'); return; }
      if(!confirm('متأكد إنك عايز تحذف المستخدم '+uname+'؟')) return;
      DB.users = DB.users.filter(u=>u.username!==uname);
      await saveUsers();
      await logAudit(uname, 'حذف مستخدم بواسطة الأدمن', '-', currentUser.username);
      showToast('اتحذف المستخدم');
      renderUsers();
    });
  });
}

/* =========================================================================
   BOOT
========================================================================= */
initApp();
</script>
