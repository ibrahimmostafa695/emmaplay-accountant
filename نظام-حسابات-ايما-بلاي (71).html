<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>النظام المحاسبي — إيما بلاي جروب</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Almarai:wght@400;700;800&family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F2EFE7;
    --panel:#FFFFFF;
    --ink:#17262E;
    --muted:#66757C;
    --sidebar:#122029;
    --sidebar-soft:#1B2E39;
    --sidebar-ink:#C9D7DC;
    --accent:#C6952F;
    --accent-deep:#95701E;
    --teal:#1F6F63;
    --rose:#B03A44;
    --line:#E4DFD1;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Cairo',sans-serif;
    min-height:100vh;
  }
  h1,h2,h3,.brand,.display{font-family:'Almarai',sans-serif;}
  .mono{font-variant-numeric:tabular-nums;}
  button{font-family:inherit;cursor:pointer;}
  input,select,textarea{font-family:inherit;}

  /* ---------- Login ---------- */
  #login-screen{
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(circle at 30% 20%, #1B2E39 0%, #122029 55%, #0B1319 100%);
    padding:24px;
  }
  .login-card{
    background:var(--panel);
    width:100%;max-width:400px;
    border-radius:16px;
    padding:36px 32px 28px;
    box-shadow:0 30px 60px rgba(0,0,0,.35);
    text-align:center;
  }
  .login-card .badge{
    display:inline-flex;align-items:center;justify-content:center;
    width:56px;height:56px;border-radius:14px;
    background:linear-gradient(135deg,var(--accent),var(--accent-deep));
    color:#fff;font-size:26px;font-weight:800;margin-bottom:14px;
  }
  .login-card h1{font-size:20px;margin:0 0 2px;}
  .login-card p.sub{color:var(--muted);font-size:13px;margin:0 0 22px;}
  .field{text-align:right;margin-bottom:14px;}
  .field label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:5px;}
  .field input,.field select{
    width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:8px;
    font-size:14.5px;background:#FBFAF7;transition:border-color .15s;
  }
  .field input:focus,.field select:focus{outline:none;border-color:var(--accent);background:#fff;}
  .btn{
    border:none;border-radius:8px;padding:11px 18px;font-size:14.5px;font-weight:700;
    display:inline-flex;align-items:center;gap:6px;justify-content:center;
  }
  .btn-primary{background:var(--ink);color:#fff;width:100%;margin-top:4px;}
  .btn-primary:hover{background:#0B1319;}
  .btn-accent{background:var(--accent);color:#241a04;}
  .btn-accent:hover{background:var(--accent-deep);color:#fff;}
  .btn-ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line);}
  .btn-ghost:hover{border-color:var(--ink);}
  .btn-danger{background:#fff;color:var(--rose);border:1.5px solid #EAC7CA;}
  .btn-danger:hover{background:var(--rose);color:#fff;border-color:var(--rose);}
  .btn-sm{padding:6px 10px;font-size:12.5px;border-radius:6px;}
  #login-error{color:var(--rose);font-size:13px;margin-top:10px;min-height:16px;}
  .login-hint{margin-top:18px;font-size:11.5px;color:#9AA6AB;line-height:1.7;border-top:1px dashed var(--line);padding-top:14px;}

  /* ---------- App shell ---------- */
  #app-screen{display:none;min-height:100vh;}
  .shell{display:flex;min-height:100vh;}
  .sidebar{
    width:240px;flex:none;background:var(--sidebar);color:var(--sidebar-ink);
    display:flex;flex-direction:column;padding:20px 14px;position:sticky;top:0;height:100vh;
  }
  .sidebar .brand{color:#fff;font-size:16px;display:flex;align-items:center;gap:10px;padding:0 6px 18px;border-bottom:1px solid #223543;margin-bottom:14px;}
  .sidebar .brand .dot{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--accent),var(--accent-deep));display:flex;align-items:center;justify-content:center;font-weight:800;color:#241a04;flex:none;}
  .nav-item{
    display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;font-size:13.5px;
    color:var(--sidebar-ink);margin-bottom:3px;border:none;background:none;width:100%;text-align:right;
  }
  .nav-item:hover{background:var(--sidebar-soft);color:#fff;}
  .nav-item.active{background:var(--accent);color:#241a04;font-weight:700;}
  .nav-section-title{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:#5F7684;padding:14px 12px 6px;}
  .sidebar-footer{margin-top:auto;padding-top:14px;border-top:1px solid #223543;}
  .user-chip{display:flex;align-items:center;gap:8px;padding:8px 6px;font-size:12.5px;}
  .user-chip .av{width:30px;height:30px;border-radius:50%;background:var(--teal);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;flex:none;}
  .user-chip .name{font-weight:700;color:#fff;}
  .user-chip .role{color:#8CA0AA;font-size:11px;}
  .logout-btn{width:100%;margin-top:8px;background:none;border:1px solid #2C4152;color:#C9D7DC;border-radius:7px;padding:8px;font-size:12.5px;}
  .logout-btn:hover{background:var(--rose);border-color:var(--rose);color:#fff;}

  .main{flex:1;min-width:0;display:flex;flex-direction:column;}
  .topbar{
    background:var(--panel);border-bottom:1px solid var(--line);padding:14px 26px;
    display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:5;
  }
  .topbar h2{font-size:17px;margin:0;}
  .topbar .cc-chips{display:flex;gap:6px;flex-wrap:wrap;}
  .chip{background:#F1ECDD;color:var(--accent-deep);border:1px solid #E5D6AE;font-size:11px;padding:3px 9px;border-radius:100px;font-weight:700;}
  .view-root{padding:24px 26px 60px;max-width:1180px;width:100%;}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:20px 22px;margin-bottom:18px;}
  .card h3{margin:0 0 16px;font-size:15.5px;display:flex;align-items:center;gap:8px;}
  .card h3 .n{background:var(--ink);color:#fff;width:22px;height:22px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-family:'Cairo';}
  .grid{display:grid;gap:14px;}
  .grid-2{grid-template-columns:1fr 1fr;}
  .grid-3{grid-template-columns:1fr 1fr 1fr;}
  .grid-4{grid-template-columns:1fr 1fr 1fr 1fr;}
  @media (max-width:900px){.grid-2,.grid-3,.grid-4{grid-template-columns:1fr;}}

  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  thead th{
    background:#12202966;position:sticky;top:0;
  }
  table.data th{
    background:var(--ink);color:#fff;padding:9px 10px;font-weight:700;font-size:12.5px;text-align:right;
  }
  table.data td{padding:8px 10px;border-bottom:1px solid var(--line);}
  table.data tbody tr:hover{background:#FAF8F2;}
  table.data tfoot td{font-weight:800;border-top:2px solid var(--ink);background:#F7F4EA;}
  .num{text-align:center;direction:ltr;font-variant-numeric:tabular-nums;}
  .debit{color:var(--teal);}
  .credit{color:var(--rose);}

  .stat-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;}
  .stat-card .lbl{font-size:12px;color:var(--muted);margin-bottom:6px;}
  .stat-card .val{font-size:22px;font-weight:800;font-family:'Almarai';}

  .entry-lines-table td, .entry-lines-table th{padding:6px 6px;}
  .entry-lines-table input,.entry-lines-table select{width:100%;padding:6px 8px;border:1.3px solid var(--line);border-radius:6px;font-size:12.5px;background:#FBFAF7;}
  .entry-lines-table input:focus,.entry-lines-table select:focus{outline:none;border-color:var(--accent);}
  .rm-line{background:none;border:none;color:var(--rose);font-size:16px;font-weight:800;}

  .badge-role{display:inline-block;padding:2px 9px;border-radius:100px;font-size:11px;font-weight:700;background:#EFEAE0;color:var(--ink);}
  .perm-tag{display:inline-block;padding:2px 8px;border-radius:6px;font-size:10.5px;background:#EAF4F1;color:var(--teal);margin:1px 2px;}
  .perm-tag.off{background:#F5EDEE;color:#B7A2A4;text-decoration:line-through;}

  .empty-state{text-align:center;padding:50px 20px;color:var(--muted);}
  .empty-state .ic{font-size:34px;margin-bottom:10px;}

  .modal-bg{position:fixed;inset:0;background:rgba(10,16,20,.55);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px;}
  .modal{background:#fff;border-radius:14px;padding:22px 24px;max-width:640px;width:100%;max-height:88vh;overflow:auto;}
  .modal h3{margin-top:0;}

  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 20px;border-radius:9px;font-size:13.5px;z-index:100;box-shadow:0 10px 30px rgba(0,0,0,.3);}

  .checkbox-row{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:13px;}
  fieldset{border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin:0;}
  legend{font-size:12px;color:var(--muted);padding:0 6px;}

  .loading-overlay{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;font-family:'Almarai';color:var(--muted);z-index:200;}

  @media print{
    .no-print{display:none!important;}
    .sidebar,.topbar{display:none!important;}
    .main{width:100%!important;}
    body{background:#fff;}
    .card{border:none;box-shadow:none;padding:0;}
    .view-root{padding:0;max-width:none;}
    .modal-bg{position:static!important;background:none!important;padding:0!important;display:block!important;}
    .modal{box-shadow:none!important;max-height:none!important;overflow:visible!important;max-width:none!important;padding:0!important;}
  }

  /* ---------- Logo ---------- */
  .brand-logo-img{height:32px;max-width:150px;object-fit:contain;border-radius:6px;}
  .login-card .badge img{width:100%;height:100%;object-fit:contain;border-radius:14px;}
  .logo-preview{height:46px;max-width:220px;object-fit:contain;border:1px solid var(--line);border-radius:8px;padding:4px;background:#fff;}

  /* ---------- Attachments ---------- */
  .attachment-info{font-size:10.5px;color:var(--muted);margin-top:4px;display:flex;align-items:center;gap:5px;}
  .attachment-info a{color:var(--teal);text-decoration:none;font-weight:700;}
  .rm-attach{border:none;background:none;color:var(--rose);cursor:pointer;font-size:12px;}

  /* ---------- Voucher (print) ---------- */
  .voucher-header{display:flex;align-items:center;justify-content:space-between;border-bottom:2px solid var(--ink);padding-bottom:14px;margin-bottom:14px;}
  .voucher-header .co-name{font-family:'Almarai';font-size:17px;}
  .voucher-header .voucher-title{text-align:left;}
  .voucher-header .voucher-title b{font-size:15px;}
  .voucher-meta{display:flex;gap:26px;margin-bottom:14px;font-size:13.5px;}
  .voucher-meta b{font-weight:800;}
  .voucher-sign{display:flex;justify-content:space-between;margin-top:34px;padding-top:14px;}
  .voucher-sign div{width:30%;text-align:center;border-top:1px solid var(--ink);padding-top:6px;font-size:12px;color:var(--muted);}
</style>
</head>
<body>

<div id="loading-overlay" class="loading-overlay">جاري تحميل البيانات…</div>

<!-- ============ LOGIN ============ -->
<div id="login-screen" style="display:none;">
  <div class="login-card">
    <button type="button" id="login-lang-toggle-btn" style="float:left;background:none;border:1.5px solid var(--line);border-radius:100px;padding:4px 12px;font-size:11.5px;color:var(--muted);cursor:pointer;">EN</button>
    <div class="badge" id="login-badge">EP</div>
    <h1 id="login-title">إيما بلاي جروب</h1>
    <p class="sub" id="login-subtitle">النظام المحاسبي — تسجيل الدخول</p>
    <form id="login-form">
      <div class="field">
        <label id="login-username-label">اسم المستخدم</label>
        <input type="text" id="login-username" autocomplete="username" required>
      </div>
      <div class="field">
        <label id="login-password-label">كلمة المرور</label>
        <input type="password" id="login-password" autocomplete="current-password" required>
        <div class="checkbox-row" style="margin-top:4px;">
          <input type="checkbox" id="login-show-password">
          <label for="login-show-password" id="login-show-password-label" style="font-size:12px;color:var(--muted);">إظهار كلمة المرور</label>
        </div>
      </div>
      <button type="submit" class="btn btn-primary" id="login-submit-btn">دخول</button>
      <div id="login-error"></div>
      <button type="button" id="forgot-password-link" style="background:none;border:none;color:var(--muted);font-size:12.5px;text-decoration:underline;cursor:pointer;margin-top:10px;">نسيت كلمة المرور؟</button>
    </form>
  </div>
</div>

<!-- ============ APP ============ -->
<div id="app-screen">
  <div class="shell">
    <aside class="sidebar no-print">
      <div class="brand"><span class="dot" id="sidebar-logo-dot">EP</span> إيما بلاي جروب</div>
      <button class="nav-item" data-view="dashboard">🏠 الرئيسية</button>
      <div class="nav-section-title">القيود</div>
      <button class="nav-item" data-view="newEntry">➕ قيد يومية جديد</button>
      <button class="nav-item" data-view="entries">📒 سجل القيود</button>
      <div class="nav-section-title">التقارير</div>
      <button class="nav-item" data-view="ledger">📘 حساب الأستاذ</button>
      <button class="nav-item" data-view="trialBalance">⚖️ ميزان المراجعة</button>
      <button class="nav-item" data-view="statement">🧾 كشف حساب</button>
      <div class="nav-section-title">القوائم المالية</div>
      <button class="nav-item" data-view="income">📈 قائمة الدخل</button>
      <button class="nav-item" data-view="balanceSheet">🏛️ قائمة المركز المالي</button>
      <button class="nav-item" data-view="cashFlow">💵 قائمة التدفقات النقدية</button>
      <button class="nav-item" data-view="profitReport">📊 تقرير الإيرادات والمصروفات</button>
      <div class="nav-section-title">الإعداد</div>
      <button class="nav-item" data-view="coa">🗂️ دليل الحسابات</button>
      <button class="nav-item" data-view="users">👥 إدارة المستخدمين</button>
      <div class="sidebar-footer">
        <div class="user-chip">
          <div class="av" id="user-av"></div>
          <div>
            <div class="name" id="user-name"></div>
            <div class="role" id="user-role"></div>
          </div>
        </div>
        <button class="logout-btn" id="logout-btn">تسجيل الخروج</button>
      </div>
    </aside>

    <div class="main">
      <div class="topbar no-print">
        <h2 id="topbar-title">الرئيسية</h2>
        <div style="display:flex;align-items:center;gap:10px;">
          <div class="cc-chips" id="topbar-chips"></div>
          <button type="button" id="lang-toggle-btn" class="btn btn-ghost btn-sm">EN</button>
        </div>
      </div>
      <div class="view-root" id="view-root"></div>
    </div>
  </div>
</div>

<div id="global-modal-holder"></div>
<div id="toast-holder"></div>

/* =========================================================================
   FIRESTORE (REST API) — replaces Claude's window.storage so the app can run
   anywhere. We talk to Firestore's plain REST endpoint with fetch() instead
   of the Firebase JS SDK, to avoid SDK/version quirks and streaming-connection
   restrictions in sandboxed or restrictive network environments.
========================================================================= */
const FIREBASE_PROJECT_ID = 'emma-play-accounting';
const FS_COLLECTION = 'app_data'; // one document per storage key, {value: JSON string}
const FS_BASE = `https://firestore.googleapis.com/v1/projects/${FIREBASE_PROJECT_ID}/databases/default/documents/${FS_COLLECTION}`;
// Journal entries are stored ONE DOCUMENT PER ENTRY (not bundled together), because
// Firestore documents have a ~1MB size ceiling and attachments can be sizeable —
// bundling every entry into a single document risked a whole-collection save failure.
const FS_ENTRIES_BASE = `https://firestore.googleapis.com/v1/projects/${FIREBASE_PROJECT_ID}/databases/default/documents/journal_entries`;
async function loadAllEntryDocs(){
  const entries = [];
  let pageToken = null;
  try{
    do{
      const url = `${FS_ENTRIES_BASE}?pageSize=300` + (pageToken?`&pageToken=${encodeURIComponent(pageToken)}`:'');
      const res = await fetch(url);
      if(!res.ok) break;
      const data = await res.json();
      (data.documents||[]).forEach(doc=>{
        try{
          const raw = doc.fields && doc.fields.data && doc.fields.data.stringValue;
          if(raw) entries.push(JSON.parse(raw));
        }catch(e){ /* skip corrupt doc */ }
      });
      pageToken = data.nextPageToken || null;
    }while(pageToken);
  }catch(e){ /* network issue — return whatever we already collected */ }
  return entries;
}
async function saveEntryDoc(entry){
  try{
    const body = { fields: { data: { stringValue: JSON.stringify(entry) } } };
    const res = await fetch(`${FS_ENTRIES_BASE}/${encodeURIComponent(entry.id)}?updateMask.fieldPaths=data`, {
      method:'PATCH', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)
    });
    if(!res.ok) throw new Error('save entry failed');
  }catch(e){ showToast('حصل خطأ أثناء حفظ القيد — ممكن يكون المرفق كبير قوي، جرب صورة أصغر'); }
}
async function deleteEntryDoc(id){
  try{
    await fetch(`${FS_ENTRIES_BASE}/${encodeURIComponent(id)}`, {method:'DELETE'});
  }catch(e){ showToast('حصل خطأ أثناء حذف القيد'); }
}

/* =========================================================================

========================================================================= */
async function loadKey(key, fallback){
  try{
    const res = await fetch(`${FS_BASE}/${encodeURIComponent(key)}`);
    if(res.status===404) return fallback;
    if(!res.ok) return fallback;
    const data = await res.json();
    const raw = data.fields && data.fields.value && data.fields.value.stringValue;
    if(raw===undefined) return fallback;
    return JSON.parse(raw);
  }catch(e){
    return fallback;
  }
}
async function saveKey(key, value){
  try{
    const body = { fields: { value: { stringValue: JSON.stringify(value) } } };
    const res = await fetch(`${FS_BASE}/${encodeURIComponent(key)}?updateMask.fieldPaths=value`, {
      method:'PATCH',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify(body)
    });
    if(!res.ok) throw new Error('save failed');
  }catch(e){
    showToast('حصل خطأ أثناء الحفظ، حاول تاني');
  }
}

  DB.users = await loadKey(STORAGE_KEYS.users, null);
  if(!DB.users){ DB.users = DEFAULT_USERS; await saveUsers(); }

  DB.coa = await loadKey(STORAGE_KEYS.coa, null);
  if(!DB.coa){ DB.coa = DEFAULT_COA; await saveCOA(); }

  DB.costCenters = await loadKey(STORAGE_KEYS.costCenters, null);
  if(!DB.costCenters){ DB.costCenters = DEFAULT_COST_CENTERS; await saveCostCenters(); }

  DB.entries = await loadAllEntryDocs();
  if(DB.entries.length===0){
    const legacy = await loadKey(STORAGE_KEYS.entries, []);
    if(legacy.length>0){
      for(const e of legacy){ await saveEntryDoc(e); }
      DB.entries = legacy;
    }
  }
  DB.logo = await loadKey(STORAGE_KEYS.logo, DEFAULT_LOGO);
  DB.auditLog = await loadKey(STORAGE_KEYS.auditLog, []);
  DB.backupEmail = await loadKey(STORAGE_KEYS.backupEmail, '');
  applyBrandLogo();

  document.getElementById('loading-overlay').style.display='none';
  document.getElementById('login-screen').style.display='flex';
}

function fmtMoney(n){

  if(Math.abs(n) < 0.005) return '-';
  return Math.abs(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
}

// Entry numbers reset every month PER BRANCH and PER TYPE (R/E/C/G), so branch 001's
// revenue entries have their own sequence separate from branch 002's, etc. Any newly
// added branch automatically gets its own sequence too since this is computed live.
function computeEntryMeta(dateStr, excludeId, branchCode, entryType){
  if(!dateStr) dateStr = todayStr();
  const [y,m] = dateStr.split('-');
  const scoped = DB.entries.filter(e=>
    e.year===y && e.month===m && e.id!==excludeId &&
    (branchCode ? e.branch===branchCode : true) &&
    (entryType ? e.entryType===entryType : true)
  );
  const seq = scoped.length ? Math.max(...scoped.map(e=>e.seq||0))+1 : 1;
  const label = `${m}-${String(seq).padStart(4,'0')}`;
  const sortKey = Number(`${y}${m}${String(seq).padStart(4,'0')}`);
  return {year:y, month:m, seq, label, sortKey};
}
function entryTypeLabel(entryType){
  return {R:'إيرادات', E:'مصروفات', C:'تكاليف', G:'عام', O:'قيد افتتاحي'}[entryType] || 'عام';
}
// Recomputes the displayed entry number (with its R/E/C type-letter prefix) in the
// new-entry / edit form whenever the date or entry type changes.
function recomputeEntryNumberDisplay(){
  const dateEl = document.getElementById('je-date');
  const typeEl = document.getElementById('je-type');
  const branchEl = document.getElementById('je-branch');
  const numEl = document.getElementById('je-number');
  if(!dateEl || !typeEl || !numEl) return;
  const branchCode = branchEl ? branchEl.value : null;
  const meta = computeEntryMeta(dateEl.value, editingEntryId, branchCode, typeEl.value);
  if(!entryNumberManuallyEdited){
    const type = typeEl.value;
    const prefix = type==='G' ? '' : type+'-';
    const branchPart = branchCode ? branchCode+'-' : '';
    numEl.value = prefix + branchPart + meta.label + (editingEntryId ? ' (تعديل)' : '');
  }
  return meta;
}
// Fallback for any legacy entry saved before month-based numbering existed.
function entrySortKey(e){
  if(typeof e.sortKey === 'number') return e.sortKey;
  const [y,m] = (e.date||'0000-00').split('-');
  return Number(`${y}${m}${String(e.entryNumber||0).toString().padStart(4,'0')}`);
}
function todayStr(){ return new Date().toISOString().slice(0,10); }
function entryBranchLabel(entry){
  const centers = Array.from(new Set(entry.lines.map(l=>l.costCenter)));
  if(centers.length===1){
    const cc = costCenterByCode(centers[0]);
    return cc ? cc.name : centers[0];
  }
  const names = centers.map(c=>{ const cc=costCenterByCode(c); return cc?cc.name:c; });
  if(names.length<=4) return names.join('، ');
  return names.slice(0,3).join('، ')+' +'+(names.length-3);
}

function readFileAsDataURL(file){
  return new Promise((resolve,reject)=>{
    const r = new FileReader();
    r.onload = ()=>resolve(r.result);
    r.onerror = ()=>reject(new Error('read failed'));
    r.readAsDataURL(file);
  });
}
function csvDownload(filename, rows){
  const csv = rows.map(r=>r.map(c=>{
    const s = String(c??'');
    return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
  }).join(',')).join('\n');
  const blob = new Blob(['\uFEFF'+csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href=url; a.download=filename; a.click();
  URL.revokeObjectURL(url);
}

    if(!Array.isArray(data.users) || !Array.isArray(data.coa) || !Array.isArray(data.costCenters) || !Array.isArray(data.entries)){

    DB.users=data.users; DB.coa=data.coa; DB.costCenters=data.costCenters; DB.entries=data.entries; DB.logo=data.logo||null;
    await saveUsers(); await saveCOA(); await saveCostCenters(); await saveEntries(); await saveLogo();
    applyBrandLogo();
    showToast('اترجعت النسخة الاحتياطية بنجاح');

/* ---- Excel export (real .xlsx via SheetJS) ---- */
function exportEntriesToExcel(){
  const visible = DB.entries.filter(e=>entryVisibleToUser(e,currentUser)).sort((a,b)=>entrySortKey(b)-entrySortKey(a));
  const rows = [];
  visible.forEach(e=>{
    e.lines.forEach(l=>{
      const acc = accountByCode(l.account), cc = costCenterByCode(l.costCenter);
      rows.push({
        'رقم القيد': e.entryNumber, 'التاريخ': e.date,
        'رقم الحساب': l.account, 'اسم الحساب': acc?acc.name:'',
        'رقم م.ت': l.costCenter, 'اسم م.ت': cc?cc.name:'',
        'مدين': l.debit||0, 'دائن': l.credit||0,
        'البيان': l.note||e.description||'', 'أدخله': e.createdBy
      });
    });
  });
  if(rows.length===0){ showToast('مفيش قيود للتصدير'); return; }
  const ws = XLSX.utils.json_to_sheet(rows);
  ws['!cols'] = [{wch:10},{wch:12},{wch:10},{wch:24},{wch:8},{wch:18},{wch:12},{wch:12},{wch:28},{wch:14}];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'القيود');
  XLSX.writeFile(wb, 'سجل-القيود.xlsx');
}

/* ---- PDF export (renders the actual on-screen element as an image, so Arabic
   text is captured correctly instead of relying on font embedding) ---- */
async function exportElementToPDF(el, filename){
  if(!el) return;
  showToast('جاري تجهيز PDF…');
  try{
    const canvas = await html2canvas(el, {scale:2, backgroundColor:'#ffffff', ignoreElements:(n)=>n.classList && n.classList.contains('no-print')});
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF({orientation:'p', unit:'pt', format:'a4'});
    const pageWidth = pdf.internal.pageSize.getWidth();
    const pageHeight = pdf.internal.pageSize.getHeight();
    const margin = 24;
    const imgWidth = pageWidth - margin*2;
    const ratio = imgWidth / canvas.width;
    const pageCanvasPx = (pageHeight - margin*2) / ratio;
    let y = 0, first = true;
    while(y < canvas.height){
      const sliceH = Math.min(pageCanvasPx, canvas.height - y);
      const pageCanvas = document.createElement('canvas');
      pageCanvas.width = canvas.width; pageCanvas.height = sliceH;
      pageCanvas.getContext('2d').drawImage(canvas, 0, y, canvas.width, sliceH, 0, 0, canvas.width, sliceH);
      if(!first) pdf.addPage();
      pdf.addImage(pageCanvas.toDataURL('image/png'), 'PNG', margin, margin, imgWidth, sliceH*ratio);
      y += sliceH; first = false;
    }
    pdf.save(filename);
    showToast('اتحفظ PDF');
  }catch(e){ showToast('حصل خطأ أثناء إنشاء PDF'); }
}

function showForceChangeModal(user){
  const holder = document.getElementById('global-modal-holder');
  const qOptions = SECURITY_QUESTIONS.map(q=>`<option value="${esc(q)}">${esc(q)}</option>`).join('')
    + `<option value="__custom__">سؤال آخر (اكتب سؤالك)</option>`;
  holder.innerHTML = `
    <div class="modal-bg" id="force-change-bg">
      <div class="modal" style="max-width:440px;">
        <h3>استكمال بيانات الحساب</h3>
        <p style="font-size:13px;color:var(--muted);line-height:1.8;">دي أول مرة تدخل بيها بالحساب ده — لازم تغيّر اسم المستخدم وكلمة المرور وتحدد سؤال أمان قبل ما تكمل.</p>
        <div class="field"><label>اسم المستخدم الجديد</label><input type="text" id="fc-username" value="${esc(user.username)}"></div>
        <div class="field"><label>كلمة المرور الجديدة</label><input type="password" id="fc-password" autocomplete="new-password"></div>
        <div class="field"><label>تأكيد كلمة المرور</label><input type="password" id="fc-password2" autocomplete="new-password"></div>
        <div class="field"><label>سؤال الأمان (لاستعادة كلمة المرور لاحقًا)</label>
          <select id="fc-question">${qOptions}</select>
        </div>
        <div class="field" id="fc-custom-q-wrap" style="display:none;"><label>اكتب سؤالك</label><input type="text" id="fc-custom-q"></div>
        <div class="field"><label>إجابتك على السؤال</label><input type="text" id="fc-answer"></div>
        <div id="fc-error" style="color:var(--rose);font-size:13px;min-height:16px;"></div>
        <button class="btn btn-primary" id="fc-save">حفظ والدخول</button>
      </div>
    </div>`;
  document.getElementById('fc-question').addEventListener('change', function(){
    document.getElementById('fc-custom-q-wrap').style.display = this.value==='__custom__' ? 'block':'none';
  });
  document.getElementById('fc-save').addEventListener('click', async ()=>{
    const newUsername = document.getElementById('fc-username').value.trim();
    const p1 = document.getElementById('fc-password').value;
    const p2 = document.getElementById('fc-password2').value;
    const qSel = document.getElementById('fc-question').value;
    const customQ = document.getElementById('fc-custom-q').value.trim();
    const answer = document.getElementById('fc-answer').value.trim();
    const errEl = document.getElementById('fc-error');
    if(!newUsername){ errEl.textContent='اكتب اسم مستخدم'; return; }
    if(DB.users.some(u=>u!==user && u.username===newUsername)){ errEl.textContent='اسم المستخدم ده مستخدم بالفعل، اختار اسم تاني'; return; }
    if(p1.length<4){ errEl.textContent='كلمة المرور لازم تكون 4 حروف/أرقام على الأقل'; return; }
    if(p1!==p2){ errEl.textContent='كلمتا المرور مش متطابقتين'; return; }
    const finalQuestion = qSel==='__custom__' ? customQ : qSel;
    if(!finalQuestion){ errEl.textContent='اكتب سؤال الأمان'; return; }
    if(!answer){ errEl.textContent='اكتب إجابة السؤال'; return; }

    const oldUsername = user.username;
    user.username = newUsername;
    user.password = p1;
    user.securityQuestion = finalQuestion;
    user.securityAnswer = answer;
    user.forceChange = false;
    await saveUsers();
    await logAudit(newUsername, 'استكمال بيانات الحساب لأول مرة', `الاسم القديم: ${oldUsername} ← الاسم الجديد: ${newUsername} — تم تعيين كلمة سر جديدة وسؤال أمان`, oldUsername);
    holder.innerHTML='';
    currentUser = user;
    document.getElementById('login-screen').style.display='none';
    document.getElementById('app-screen').style.display='block';
    setupSidebarForUser();
    navigate('dashboard');
    showToast('تم تحديث بياناتك بنجاح، أهلاً بيك');
  });
}

async function navigate(view){
  currentView = view;
  document.getElementById('topbar-title').textContent = currentLang==='ar' ? (VIEW_TITLES[view]||'') : (VIEW_TITLES_EN[view]||VIEW_TITLES[view]||'');
  document.querySelectorAll('.nav-item[data-view]').forEach(b=>b.classList.toggle('active', b.dataset.view===view));

  // Always pull the latest shared data first, so changes made by other users/sessions
  // (new users, edited accounts, new entries, etc.) are reflected immediately.
  try{
    const [users, coa, costCenters, entries, auditLog] = await Promise.all([
      loadKey(STORAGE_KEYS.users, DB.users),
      loadKey(STORAGE_KEYS.coa, DB.coa),
      loadKey(STORAGE_KEYS.costCenters, DB.costCenters),
      loadAllEntryDocs(),
      loadKey(STORAGE_KEYS.auditLog, DB.auditLog),
    ]);
    DB.users = users; DB.coa = coa; DB.costCenters = costCenters; DB.entries = entries.length?entries:DB.entries; DB.auditLog = auditLog;
    DB.backupEmail = await loadKey(STORAGE_KEYS.backupEmail, DB.backupEmail);
    const fresh = DB.users.find(u=>u.username===currentUser.username);
    if(fresh){ currentUser = fresh; }
  }catch(e){ /* keep whatever we already had in memory */ }

  setupSidebarForUser();
  (VIEW_RENDERERS[view]||renderDashboard)();
}

}

function gatherFormLines(){
  const lines = [];
  document.querySelectorAll('#lines-tbody tr').forEach(tr=>{
    const account = tr.querySelector('.line-account').value;
    const cc = tr.querySelector('.line-cc').value;
    const debit = parseFloat(tr.querySelector('.line-debit').value)||0;
    const credit = parseFloat(tr.querySelector('.line-credit').value)||0;
    const note = tr.querySelector('.line-note').value.trim();
    const attachment = tr.dataset.attachment || null;
    const attachmentName = tr.dataset.attachmentName || null;
    if(!account || !cc) return;
    if(debit===0 && credit===0) return;
    lines.push({account, costCenter:cc, debit, credit, note, attachment, attachmentName});
  });
  lines.sort((a,b)=> a.account.localeCompare(b.account));
  return lines;
}

function normalizeDateValue(val){
  if(!val && val!==0) return null;
  // Raw Excel serial number (days since 1899-12-30) — safest path, no timezone ambiguity.
  if(typeof val === 'number'){
    const ms = Math.round((val - 25569) * 86400 * 1000);
    const d = new Date(ms);
    return `${d.getUTCFullYear()}-${String(d.getUTCMonth()+1).padStart(2,'0')}-${String(d.getUTCDate()).padStart(2,'0')}`;
  }
  if(val instanceof Date && !isNaN(val)){
    // Read with UTC getters: SheetJS builds cellDates using Date.UTC(), so UTC getters
    // give the calendar date exactly as written in the sheet regardless of the
    // browser's local timezone (local getters would shift it for some timezones).
    return `${val.getUTCFullYear()}-${String(val.getUTCMonth()+1).padStart(2,'0')}-${String(val.getUTCDate()).padStart(2,'0')}`;
  }
  const s = String(val).trim();
  if(/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
  const dmY = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/);
  if(dmY){ return `${dmY[3]}-${dmY[2].padStart(2,'0')}-${dmY[1].padStart(2,'0')}`; }
  const d = new Date(s);
  if(!isNaN(d)) return `${d.getUTCFullYear()}-${String(d.getUTCMonth()+1).padStart(2,'0')}-${String(d.getUTCDate()).padStart(2,'0')}`;
  return null;
}
// Handles cells that contain plain numbers, numeric text, or a simple unevaluated
// formula string like "=8085+1750" (common when data is exported without recalculating).
function parseNumericCell(val){
  if(typeof val === 'number') return val;
  if(val===null || val===undefined || val==='') return 0;
  let s = String(val).trim();
  if(s.startsWith('=')) s = s.slice(1);
  if(/^[\d.\s+\-*/()]+$/.test(s) && s.trim()!==''){
    try{
      const v = Function('"use strict";return ('+s+')')();
      if(typeof v==='number' && isFinite(v)) return v;
    }catch(e){ /* fall through */ }
  }
  const n = parseFloat(s);
  return isNaN(n) ? 0 : n;
}

async function importEntriesFromExcel(file){
  if(!currentUser.perms.addEntry){ showToast('مفيش عندك صلاحية إضافة قيود'); return; }
  let rows;
  try{
    const data = await file.arrayBuffer();
    const wb = XLSX.read(data, {type:'array'});
    const sheet = wb.Sheets[wb.SheetNames[0]];
    rows = XLSX.utils.sheet_to_json(sheet, {defval:''});
  }catch(e){
    showToast('حصل خطأ في قراءة الملف، تأكد إنه ملف Excel صحيح');
    return;
  }
  if(!rows || rows.length===0){ showToast('الملف فاضي أو التنسيق غلط'); return; }

  const groups = {};
  const groupOrder = [];
  const groupMeta = {};
  rows.forEach(r=>{
    const tempKey = String(r['رقم القيد المؤقت']??'').trim();
    if(!tempKey) return;
    const rowDate = normalizeDateValue(r['التاريخ']);
    const rowType = String(r['نوع القيد']||'G').trim().toUpperCase();
    // Grouped by date+type+temp only (NOT branch) — one combined entry per day,
    // its lines can span several branches, each line keeping its own branch.
    const compositeKey = (rowDate||'?')+'|'+rowType+'|'+tempKey;
    if(!groups[compositeKey]){
      groups[compositeKey]=[];
      groupOrder.push(compositeKey);
      groupMeta[compositeKey] = {label: tempKey+' ('+esc(rowDate||'?')+')', date:rowDate, entryType:rowType, description:String(r['بيان السند']||'').trim()};
    }
    groups[compositeKey].push(r);
  });
  if(groupOrder.length===0){ showToast('محتاج عمود "رقم القيد المؤقت" لتجميع سطور كل قيد'); return; }
  // Process oldest date first so the sequential entry number lines up with the date order.
  groupOrder.sort((a,b)=>{
    const da = groupMeta[a].date||'', db = groupMeta[b].date||'';
    return da.localeCompare(db);
  });

  const allowedCenters = userAllowedCenters(currentUser);
  let successCount=0;
  const errors = [];
  const newEntries = [];

  groupOrder.forEach(key=>{
    const groupRows = groups[key];
    const {label, date, entryType, description} = groupMeta[key];

    if(!date){ errors.push(`مجموعة ${label}: تاريخ غير صالح`); return; }
    if(!['R','E','C','G','O'].includes(entryType)){ errors.push(`مجموعة ${label}: نوع قيد غير صالح (${esc(entryType)}) — لازم R أو E أو C أو G أو O`); return; }

    const lines = [];
    let lineErr = null;
    const branchesUsed = new Set();
    for(const row of groupRows){
      const accCode = String(row['رقم الحساب']||'').trim();
      const rowBranch = String(row['الفرع']||'').trim();
      const debit = parseNumericCell(row['مدين']);
      const credit = parseNumericCell(row['دائن']);
      const note = String(row['بيان السطر']||'').trim();
      if(debit===0 && credit===0) continue;
      if(!rowBranch || !costCenterByCode(rowBranch)){ lineErr = `كود فرع غير موجود (${esc(rowBranch)})`; break; }
      if(!allowedCenters.includes(rowBranch)){ lineErr = `مش مسموحلك بالفرع ${esc(rowBranch)}`; break; }
      const acc = accountByCode(accCode);
      if(!acc || acc.type!=='تفصيلي'){ lineErr = `رقم حساب غير صالح أو مش تفصيلي (${esc(accCode)})`; break; }
      if(debit>0 && credit>0){ lineErr = `سطر فيه مدين ودائن مع بعض`; break; }
      branchesUsed.add(rowBranch);
      lines.push({account:accCode, costCenter:rowBranch, debit, credit, note, attachment:null, attachmentName:null});
    }
    if(lineErr){ errors.push(`مجموعة ${label}: ${lineErr}`); return; }
    if(lines.length<2){ errors.push(`مجموعة ${label}: لازم سطرين على الأقل بمبالغ`); return; }
    lines.sort((a,b)=>a.account.localeCompare(b.account));
    const td = lines.reduce((s,l)=>s+l.debit,0), tc = lines.reduce((s,l)=>s+l.credit,0);
    if(Math.abs(td-tc)>0.005){ errors.push(`مجموعة ${label}: غير متوازن (مدين ${td.toFixed(2)} / دائن ${tc.toFixed(2)})`); return; }

    // If every line happens to share one branch, number the entry under that branch's
    // own sequence; otherwise it's a combined multi-branch entry, numbered generally.
    const singleBranch = branchesUsed.size===1 ? [...branchesUsed][0] : null;
    const meta = computeEntryMeta(date, null, singleBranch, entryType);
    const prefix = entryType==='G' ? '' : entryType+'-';
    const branchPart = singleBranch ? singleBranch+'-' : '';
    newEntries.push({
      id: 'e'+Date.now()+Math.random().toString(36).slice(2,7),
      entryNumber: prefix+branchPart+meta.label, year:meta.year, month:meta.month, seq:meta.seq, sortKey:meta.sortKey,
      entryType, branch: singleBranch, date, description, lines,
      createdBy: currentUser.username, createdAt: new Date().toISOString()
    });
    // Make this entry immediately visible to computeEntryMeta for the next iteration,
    // so sequence numbers increment correctly across the sorted date order.
    DB.entries.push(newEntries[newEntries.length-1]);
    successCount++;
  });
  // Undo the temporary pushes above; we'll push the validated batch for real just below.
  newEntries.forEach(e=>{ const i=DB.entries.indexOf(e); if(i>-1) DB.entries.splice(i,1); });

  if(newEntries.length>0){
    DB.entries.push(...newEntries);
    await Promise.all(newEntries.map(e=>saveEntryDoc(e)));
  }
  showToast(`تم استيراد ${successCount} قيد بنجاح${errors.length?` — وفشل ${errors.length}`:''}`);
  if(errors.length>0) showImportErrorsModal(errors, successCount);
  renderNewEntry();
}

async function saveNewEntry(){
  const date = document.getElementById('je-date').value;
  const desc = document.getElementById('je-desc').value.trim();
  const entryType = document.getElementById('je-type').value;
  if(!date){ showToast('اختار تاريخ للقيد'); return; }
  const lines = [];
  let ok = true;
  document.querySelectorAll('#lines-tbody tr').forEach(tr=>{
    const account = tr.querySelector('.line-account').value;
    const cc = tr.querySelector('.line-cc').value;
    const debit = parseFloat(tr.querySelector('.line-debit').value)||0;
    const credit = parseFloat(tr.querySelector('.line-credit').value)||0;
    const note = tr.querySelector('.line-note').value.trim();
    const attachment = tr.dataset.attachment || null;
    const attachmentName = tr.dataset.attachmentName || null;
    if(!account || !cc){ ok=false; return; }
    if(debit>0 && credit>0){ ok=false; return; }
    if(debit===0 && credit===0){ return; }
    lines.push({account, costCenter:cc, debit, credit, note, attachment, attachmentName});
  });
  lines.sort((a,b)=> a.account.localeCompare(b.account));
  if(!ok){ showToast('راجع سطور القيد، فيه بيانات ناقصة أو غلط'); return; }
  if(lines.length<2){ showToast('لازم سطرين على الأقل بمبالغ'); return; }
  const td = lines.reduce((s,l)=>s+l.debit,0);
  const tc = lines.reduce((s,l)=>s+l.credit,0);
  if(Math.abs(td-tc)>0.005 || td<=0){ showToast('القيد لازم يكون متوازن (مدين = دائن)'); return; }
  const prefix = entryType==='G' ? '' : entryType+'-';
  const branchCode = document.getElementById('je-branch').value;
  const branchPart = branchCode ? branchCode+'-' : '';
  const manualNumber = document.getElementById('je-number').value.trim().replace(/\s*\(تعديل\)\s*$/,'');

  if(editingEntryId){
    const entry = DB.entries.find(e=>e.id===editingEntryId);
    if(!entry){ showToast('القيد الأصلي مش موجود'); editingEntryId=null; return; }
    const meta = computeEntryMeta(date, editingEntryId, branchCode, entryType);
    entry.date = date;
    entry.description = desc;
    entry.lines = lines;
    entry.entryType = entryType;
    entry.branch = branchCode;
    entry.year = meta.year; entry.month = meta.month; entry.seq = meta.seq; entry.sortKey = meta.sortKey;
    entry.entryNumber = manualNumber || (prefix + branchPart + meta.label);
    await saveEntryDoc(entry);
    showToast('اتحفظ تعديل القيد رقم '+entry.entryNumber);
    editingEntryId = null;
    renderNewEntry();
    return;
  }

  const meta = computeEntryMeta(date, null, branchCode, entryType);
  const entry = {
    id: 'e'+Date.now(),
    entryNumber: manualNumber || (prefix + branchPart + meta.label), year: meta.year, month: meta.month, seq: meta.seq, sortKey: meta.sortKey,
    entryType, branch: branchCode, date, description: desc, lines,
    createdBy: currentUser.username, createdAt: new Date().toISOString()
  };
  DB.entries.push(entry);
  await saveEntryDoc(entry);
  showToast('اتحفظ القيد رقم '+entry.entryNumber);
  renderNewEntry();
}

  function applyEntriesFilters(){

    const branch = document.getElementById('entries-branch-filter').value;
    document.querySelectorAll('#entries-list-card tbody tr[data-entrynum]').forEach(tr=>{
      const matchesNum = tr.dataset.entrynum.includes(q);
      const matchesBranch = !branch || (' '+tr.dataset.branches+' ').includes(' '+branch+' ');
      tr.style.display = (matchesNum && matchesBranch) ? '' : 'none';
    });
  }
  document.getElementById('entries-search-num').addEventListener('input', applyEntriesFilters);
  document.getElementById('entries-branch-filter').addEventListener('change', applyEntriesFilters);
  document.getElementById('entries-export-pdf').addEventListener('click', ()=>{
    exportElementToPDF(document.getElementById('entries-list-card'), 'سجل-القيود.pdf');
  });
  if(canBulkDelete){
    function updateSelectedCount(){
      const n = document.querySelectorAll('.entry-select-cb:checked').length;
      document.getElementById('entries-selected-count').textContent = n;
    }
    root.querySelectorAll('.entry-select-cb').forEach(cb=>cb.addEventListener('change', updateSelectedCount));

        const cb = tr.querySelector('.entry-select-cb');
        if(cb) cb.checked = true;
      });
      updateSelectedCount();

      root.querySelectorAll('.entry-select-cb').forEach(cb=>cb.checked=false);
      updateSelectedCount();

      await Promise.all(ids.map(id=>deleteEntryDoc(id)));
      showToast(`اتحذف ${ids.length} قيد`);
      renderEntriesList();
    });

    if(entry.description) text += `البيان: ${entry.description}\n`;
    text += `\nالسطور:\n`;
    entry.lines.forEach(l=>{
      const acc = accountByCode(l.account);
      text += `- ${acc?acc.name:l.account}: ${l.debit?('مدين '+fmtMoney(l.debit)):('دائن '+fmtMoney(l.credit))}\n`;

      bindModalRemoveButtons();
      bindAttachmentInputs('#modal-lines-tbody');
    });
    document.getElementById('modal-save-entry').addEventListener('click', async ()=>{
      const newLines=[]; let ok=true;
      document.querySelectorAll('#modal-lines-tbody tr').forEach(tr=>{
        const account = tr.querySelector('.line-account').value;
        const cc = tr.querySelector('.line-cc').value;
        const debit = parseFloat(tr.querySelector('.line-debit').value)||0;
        const credit = parseFloat(tr.querySelector('.line-credit').value)||0;
        const note = tr.querySelector('.line-note').value.trim();
        const attachment = tr.dataset.attachment || null;
        const attachmentName = tr.dataset.attachmentName || null;
        if(!account||!cc){ok=false;return;}
        if(debit>0&&credit>0){ok=false;return;}
        if(debit===0&&credit===0) return;
        newLines.push({account,costCenter:cc,debit,credit,note,attachment,attachmentName});
      });
      newLines.sort((a,b)=> a.account.localeCompare(b.account));
      if(!ok || newLines.length<2){ showToast('راجع السطور'); return; }
      const td=newLines.reduce((s,l)=>s+l.debit,0), tc=newLines.reduce((s,l)=>s+l.credit,0);
      if(Math.abs(td-tc)>0.005){ showToast('القيد لازم يكون متوازن'); return; }
      entry.lines = newLines;
      await saveEntryDoc(entry);
      showToast('اتحفظ التعديل');
      holder.innerHTML='';
      renderEntriesList();
    });
  }
}
async function deleteEntry(id){
  if(!confirm('متأكد إنك عايز تحذف القيد ده؟')) return;
  DB.entries = DB.entries.filter(e=>e.id!==id);
  await deleteEntryDoc(id);
  showToast('اتحذف القيد');
  renderEntriesList();
}

function computeOpeningBalance(accountCode, costCenterCodes, beforeDate){
  if(!beforeDate) return 0;
  let bal=0;
  DB.entries.forEach(e=>{
    if(e.date>=beforeDate) return;
    e.lines.forEach(l=>{
      if(l.account!==accountCode) return;
      if(!costCenterCodes.includes(l.costCenter)) return;
      bal += (l.debit-l.credit);
    });
  });
  return bal;
}

function runLedger(){

  let selectedCenters = getCheckedValues('gl-cc-item');
  const allowed = userAllowedCenters(currentUser);
  if(selectedCenters.length===0) selectedCenters = allowed.slice();
  selectedCenters = selectedCenters.filter(c=>allowed.includes(c));
  const from = document.getElementById('gl-from').value;
  const to = document.getElementById('gl-to').value;
  const holder = document.getElementById('gl-result');

  if(selectedAccounts.length===0){
    holder.innerHTML = `<div class="card"><div class="empty-state"><div class="ic">📘</div>اختار حساب واحد على الأقل.</div></div>`;
    return;
  }

  let sections = [];
  let grandDebit=0, grandCredit=0;
  const excelRows = [];

  selectedAccounts.forEach(accCode=>{
    const acc = accountByCode(accCode);
    let rows = [];
    DB.entries.forEach(e=>{
      if(from && e.date<from) return;
      if(to && e.date>to) return;
      e.lines.forEach(l=>{
        if(l.account!==accCode) return;
        if(!selectedCenters.includes(l.costCenter)) return;
        rows.push({entryNumber:e.entryNumber, sortKey:entrySortKey(e), date:e.date, cc:l.costCenter, debit:l.debit, credit:l.credit, note:l.note||e.description});
      });
    });
    rows.sort((a,b)=> a.date===b.date ? a.sortKey-b.sortKey : a.date.localeCompare(b.date));
    if(rows.length===0 && !glOpeningCarried) return;

    const opening = glOpeningCarried ? computeOpeningBalance(accCode, selectedCenters, from) : 0;
    let bal = opening, td=0, tc=0;

    }
    rows.forEach(r=>{
      bal += (r.debit - r.credit);
      td += r.debit; tc += r.credit;

    });
    grandDebit+=td; grandCredit+=tc;
    sections.push(`
      <div style="margin-bottom:22px;">
        <h4 style="font-size:14px;margin:0 0 8px;">📘 ${accCode} - ${esc(acc?acc.name:'')}</h4>

            <tbody>${trs}</tbody>
            <tfoot><tr><td colspan="4">${currentLang==='ar'?'إجمالي الحساب':'Account Total'}</td><td class="num">${fmtMoney(td)}</td><td class="num">${fmtMoney(tc)}</td><td>${fmtBalance(bal)}</td><td></td></tr></tfoot>
          </table>
        </div>
      </div>`);
  });

  if(sections.length===0){
    holder.innerHTML = `<div class="card"><div class="empty-state"><div class="ic">📄</div>مفيش حركة للاختيار ده.</div></div>`;
    return;
  }

  holder.innerHTML = `
    <div class="card printable" id="gl-report-card">
      ${sections.join('')}
      <div style="border-top:2px solid var(--ink);padding-top:10px;font-weight:800;display:flex;justify-content:space-between;">
        <span>${tt('grandTotal')}</span>

      ${prepReviewFooterHTML(currentUser.username)}

        <button class="btn btn-ghost btn-sm" id="gl-pdf">${tt('savePDF')}</button>`:''}
        <button class="btn btn-ghost btn-sm" id="gl-export">${tt('exportExcel')}</button>
      </div>
    </div>
  `;
  document.getElementById('gl-export').addEventListener('click',()=>{
    const ws = XLSX.utils.json_to_sheet(excelRows);
    ws['!cols']=[{wch:10},{wch:12},{wch:10},{wch:24},{wch:8},{wch:18},{wch:12},{wch:12},{wch:14},{wch:26}];
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'حساب الاستاذ');
    XLSX.writeFile(wb, 'حساب-الاستاذ.xlsx');
  });

  if(previewBtn) previewBtn.addEventListener('click', ()=>previewReportModal('gl-report-card', 'حساب الأستاذ'));

  if(pdfBtn) pdfBtn.addEventListener('click', ()=>exportElementToPDF(document.getElementById('gl-report-card'), 'حساب-الاستاذ.pdf'));
}

function runTrialBalance(){
  let selectedAccounts = getCheckedValues('tb-acc-item');
  if(selectedAccounts.length===0) selectedAccounts = detailAccounts().map(a=>a.code);
  let selectedCenters = getCheckedValues('tb-cc-item');
  const allowed = userAllowedCenters(currentUser);
  if(selectedCenters.length===0) selectedCenters = allowed.slice();
  selectedCenters = selectedCenters.filter(c=>allowed.includes(c));
  const showZero = document.getElementById('tb-show-zero').checked;
  const from = document.getElementById('tb-from').value;
  const to = document.getElementById('tb-to').value;

  const totals = {};
  selectedAccounts.forEach(code=>{ totals[code] = {debit:0, credit:0}; });
  DB.entries.forEach(e=>{
    if(from && e.date<from) return;
    if(to && e.date>to) return;
    e.lines.forEach(l=>{
      if(!totals.hasOwnProperty(l.account)) return;
      if(!selectedCenters.includes(l.costCenter)) return;
      totals[l.account].debit += l.debit;
      totals[l.account].credit += l.credit;
    });
  });

  let accCodes = Object.keys(totals).sort();
  if(!showZero){
    accCodes = accCodes.filter(c=> Math.abs(totals[c].debit)>0.005 || Math.abs(totals[c].credit)>0.005);
  }
  if(accCodes.length===0){
    document.getElementById('tb-result').innerHTML = `<div class="card"><div class="empty-state"><div class="ic">⚖️</div>مفيش حركة تتعرض في ميزان المراجعة لهذا النطاق.</div></div>`;
    return;
  }
  let gTd=0,gTc=0,gBalD=0,gBalC=0;
  const trs = accCodes.map(code=>{
    const acc = accountByCode(code);
    const t = totals[code];
    gTd+=t.debit; gTc+=t.credit;
    const net = t.debit - t.credit;
    if(net>=0) gBalD+=net; else gBalC+=(-net);
    return `<tr><td>${code}</td><td>${esc(acc?acc.name:'')}</td>
      <td class="num debit">${fmtMoney(t.debit)}</td><td class="num credit">${fmtMoney(t.credit)}</td>
      <td class="num debit">${net>=0?fmtMoney(net):'-'}</td>
      <td class="num credit">${net<0?fmtMoney(-net):'-'}</td></tr>`;
  }).join('');

  document.getElementById('tb-result').innerHTML = `
    <div class="card printable" id="tb-report-card">
      <h3><span class="n">⚖️</span> ${tt('trialBalanceTitle')}</h3>
      <div style="overflow:auto;">
        <table class="data">
          <thead><tr><th>${tt('accountNumber')}</th><th>${tt('accountName')}</th><th>${tt('movementDebit')}</th><th>${tt('movementCredit')}</th><th>${tt('balanceDebit')}</th><th>${tt('balanceCredit')}</th></tr></thead>
          <tbody>${trs}</tbody>
          <tfoot><tr><td colspan="2">${tt('total')}</td><td class="num">${fmtMoney(gTd)}</td><td class="num">${fmtMoney(gTc)}</td><td class="num">${fmtMoney(gBalD)}</td><td class="num">${fmtMoney(gBalC)}</td></tr></tfoot>
        </table>
      </div>
      <p style="font-size:12.5px;color:var(--muted);margin-top:10px;">
        ${Math.abs(gBalD-gBalC)<0.01 ? (currentLang==='ar'?'✅ الميزان متزن (إجمالي أرصدة المدين = إجمالي أرصدة الدائن).':'✅ Balanced (total debit balances = total credit balances).') : (currentLang==='ar'?'⚠️ فيه فرق بين إجمالي المدين والدائن، راجع القيود.':'⚠️ There is a difference between total debit and credit — please review the entries.')}
      </p>
      ${prepReviewFooterHTML(currentUser.username)}
      <div class="no-print" style="margin-top:10px;display:flex;gap:10px;flex-wrap:wrap;">
        ${currentUser.perms.print?`<button class="btn btn-ghost btn-sm" id="tb-preview">${tt('preview')}</button>
        <button class="btn btn-ghost btn-sm" id="tb-pdf">${tt('savePDF')}</button>`:''}
        <button class="btn btn-ghost btn-sm" id="tb-export">${tt('exportExcel')}</button>
      </div>
    </div>
  `;
  document.getElementById('tb-export').addEventListener('click',()=>{
    const rows = accCodes.map(code=>{
      const acc=accountByCode(code); const t=totals[code]; const net=t.debit-t.credit;
      return {'رقم الحساب':code,'اسم الحساب':acc?acc.name:'','حركة مدين':t.debit||0,'حركة دائن':t.credit||0,
        'الرصيد مدين':net>=0?net:'','الرصيد دائن':net<0?(-net):''};
    });
    const ws = XLSX.utils.json_to_sheet(rows);
    ws['!cols'] = [{wch:10},{wch:24},{wch:14},{wch:14},{wch:14},{wch:14}];
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'ميزان المراجعة');
    XLSX.writeFile(wb, 'ميزان-المراجعة.xlsx');
  });
  const previewBtn = document.getElementById('tb-preview');
  if(previewBtn) previewBtn.addEventListener('click', ()=>previewReportModal('tb-report-card', 'ميزان المراجعة'));
  const pdfBtn = document.getElementById('tb-pdf');
  if(pdfBtn) pdfBtn.addEventListener('click', ()=>exportElementToPDF(document.getElementById('tb-report-card'), 'ميزان-المراجعة.pdf'));
}

function runIncomeStatement(){
  let selectedAccounts = getCheckedValues('is-acc-item');
  if(selectedAccounts.length===0) selectedAccounts = detailAccounts().filter(a=>isRevenueCode(a.code)||isExpenseCode(a.code)).map(a=>a.code);
  let selectedCenters = getCheckedValues('is-cc-item');
  const allowed = userAllowedCenters(currentUser);
  if(selectedCenters.length===0) selectedCenters = allowed.slice();
  selectedCenters = selectedCenters.filter(c=>allowed.includes(c));
  const from = document.getElementById('is-from').value;
  const to = document.getElementById('is-to').value;
  const holder = document.getElementById('is-result');

  const totals = {};
  selectedAccounts.forEach(c=>{ totals[c] = {debit:0,credit:0}; });
  DB.entries.forEach(e=>{
    if(from && e.date<from) return;
    if(to && e.date>to) return;
    e.lines.forEach(l=>{
      if(!totals.hasOwnProperty(l.account)) return;
      if(!selectedCenters.includes(l.costCenter)) return;
      totals[l.account].debit += l.debit;
      totals[l.account].credit += l.credit;
    });
  });

  const revCodes = selectedAccounts.filter(isRevenueCode).sort();
  const expCodes = selectedAccounts.filter(isExpenseCode).sort();
  let totalRev=0, totalExp=0;
  const excelRows = [];
  const revRows = revCodes.map(code=>{
    const acc = accountByCode(code); const t = totals[code];
    const amount = t.credit - t.debit;
    totalRev += amount;
    excelRows.push({'القسم':'إيرادات','رقم الحساب':code,'اسم الحساب':acc?acc.name:'','المبلغ':amount.toFixed(2)});
    return `<tr><td>${code}</td><td>${esc(acc?acc.name:'')}</td><td class="num debit">${fmtMoney(amount)}</td></tr>`;
  }).join('');
  const expRows = expCodes.map(code=>{
    const acc = accountByCode(code); const t = totals[code];
    const amount = t.debit - t.credit;
    totalExp += amount;
    excelRows.push({'القسم':'مصروفات','رقم الحساب':code,'اسم الحساب':acc?acc.name:'','المبلغ':amount.toFixed(2)});
    return `<tr><td>${code}</td><td>${esc(acc?acc.name:'')}</td><td class="num credit">${fmtMoney(amount)}</td></tr>`;
  }).join('');
  const netIncome = totalRev - totalExp;

  holder.innerHTML = `
    <div class="card printable" id="is-report-card">
      <h3><span class="n">📈</span> ${tt('incomeStatementTitle')} ${from||to? `(${from||(currentLang==='ar'?'البداية':'Start')} — ${to||(currentLang==='ar'?'اليوم':'Today')})`:''}</h3>
      <h4 style="font-size:13.5px;margin:14px 0 8px;">${tt('revenues')}</h4>
      <table class="data"><thead><tr><th>${tt('accountNumber')}</th><th>${tt('accountName')}</th><th>${currentLang==='ar'?'المبلغ':'Amount'}</th></tr></thead>
        <tbody>${revRows || `<tr><td colspan="3" style="color:var(--muted);">${currentLang==='ar'?'لا يوجد':'None'}</td></tr>`}</tbody>
        <tfoot><tr><td colspan="2">${tt('totalRevenues')}</td><td class="num debit">${fmtMoney(totalRev)}</td></tr></tfoot>
      </table>
      <h4 style="font-size:13.5px;margin:18px 0 8px;">${tt('expenses')}</h4>
      <table class="data"><thead><tr><th>${tt('accountNumber')}</th><th>${tt('accountName')}</th><th>${currentLang==='ar'?'المبلغ':'Amount'}</th></tr></thead>
        <tbody>${expRows || `<tr><td colspan="3" style="color:var(--muted);">${currentLang==='ar'?'لا يوجد':'None'}</td></tr>`}</tbody>
        <tfoot><tr><td colspan="2">${tt('totalExpenses')}</td><td class="num credit">${fmtMoney(totalExp)}</td></tr></tfoot>
      </table>
      <div style="border-top:2px solid var(--ink);margin-top:16px;padding-top:10px;font-weight:800;display:flex;justify-content:space-between;font-size:15px;">
        <span>${netIncome>=0?tt('netProfit'):tt('netLoss')}</span>
        <span class="num ${netIncome>=0?'debit':'credit'}">${fmtMoney(netIncome)}</span>
      </div>
      ${prepReviewFooterHTML(currentUser.username)}
      <div class="no-print" style="margin-top:14px;display:flex;gap:10px;flex-wrap:wrap;">
        ${currentUser.perms.print?`<button class="btn btn-ghost btn-sm" id="is-preview">${tt('preview')}</button>
        <button class="btn btn-ghost btn-sm" id="is-pdf">${tt('savePDF')}</button>`:''}
        <button class="btn btn-ghost btn-sm" id="is-export">${tt('exportExcel')}</button>
      </div>
    </div>
  `;
  document.getElementById('is-export').addEventListener('click',()=>{
    const ws = XLSX.utils.json_to_sheet(excelRows.concat([{'القسم':'','رقم الحساب':'','اسم الحساب':'صافي '+(netIncome>=0?'الربح':'الخسارة'),'المبلغ':netIncome.toFixed(2)}]));
    ws['!cols']=[{wch:10},{wch:10},{wch:26},{wch:14}];
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'قائمة الدخل');

function runBalanceSheet(){
  let selectedAccounts = getCheckedValues('bs-acc-item');
  if(selectedAccounts.length===0) selectedAccounts = detailAccounts().map(a=>a.code);
  let selectedCenters = getCheckedValues('bs-cc-item');
  const allowed = userAllowedCenters(currentUser);
  if(selectedCenters.length===0) selectedCenters = allowed.slice();
  selectedCenters = selectedCenters.filter(c=>allowed.includes(c));
  const to = document.getElementById('bs-to').value || todayStr();
  const from = document.getElementById('bs-from').value;
  const holder = document.getElementById('bs-result');

  // Cumulative balance for every selected account up to and including "to"
  function cumulativeBalance(code){
    let bal=0;
    DB.entries.forEach(e=>{
      if(e.date>to) return;
      e.lines.forEach(l=>{
        if(l.account!==code) return;
        if(!selectedCenters.includes(l.costCenter)) return;
        bal += (l.debit-l.credit);
      });
    });
    return bal;
  }
  const assetCodes = selectedAccounts.filter(c=>c.startsWith('1')).sort();
  const liabEquityCodes = selectedAccounts.filter(c=>c.startsWith('2')).sort();

  let totalAssets=0, totalLiabEquity=0;
  const excelRows = [];
  const assetRows = assetCodes.map(code=>{
    const acc = accountByCode(code); const bal = cumulativeBalance(code);
    if(Math.abs(bal)<0.005) return '';
    totalAssets += bal;
    excelRows.push({'القسم':'أصول','رقم الحساب':code,'اسم الحساب':acc?acc.name:'','الرصيد':bal.toFixed(2)});
    return `<tr><td>${code}</td><td>${esc(acc?acc.name:'')}</td><td class="num debit">${fmtMoney(bal)}</td></tr>`;
  }).join('');
  const liabRows = liabEquityCodes.map(code=>{
    const acc = accountByCode(code); const bal = -cumulativeBalance(code); // liabilities/equity are credit-natured
    if(Math.abs(bal)<0.005) return '';
    totalLiabEquity += bal;
    excelRows.push({'القسم':'خصوم وحقوق ملكية','رقم الحساب':code,'اسم الحساب':acc?acc.name:'','الرصيد':bal.toFixed(2)});
    return `<tr><td>${code}</td><td>${esc(acc?acc.name:'')}</td><td class="num credit">${fmtMoney(bal)}</td></tr>`;
  }).join('');

  // current-period net income plugged into equity so the statement balances
  let periodRev=0, periodExp=0;
  DB.entries.forEach(e=>{
    if(from && e.date<from) return;
    if(e.date>to) return;
    e.lines.forEach(l=>{
      if(!selectedCenters.includes(l.costCenter)) return;
      if(isRevenueCode(l.account)) periodRev += (l.credit-l.debit);
      else if(isExpenseCode(l.account)) periodExp += (l.debit-l.credit);
    });
  });
  const netIncome = periodRev - periodExp;
  totalLiabEquity += netIncome;

  holder.innerHTML = `
    <div class="card printable" id="bs-report-card">
      <h3><span class="n">🏛️</span> ${tt('balanceSheetTitle')} ${currentLang==='ar'?'كما في':'as of'} ${to}</h3>
      <h4 style="font-size:13.5px;margin:14px 0 8px;">${tt('assets')}</h4>
      <table class="data"><thead><tr><th>${tt('accountNumber')}</th><th>${tt('accountName')}</th><th>${tt('balance')}</th></tr></thead>
        <tbody>${assetRows || `<tr><td colspan="3" style="color:var(--muted);">${currentLang==='ar'?'لا يوجد':'None'}</td></tr>`}</tbody>
        <tfoot><tr><td colspan="2">${tt('totalAssets')}</td><td class="num debit">${fmtMoney(totalAssets)}</td></tr></tfoot>
      </table>
      <h4 style="font-size:13.5px;margin:18px 0 8px;">${tt('liabilitiesEquity')}</h4>
      <table class="data"><thead><tr><th>${tt('accountNumber')}</th><th>${tt('accountName')}</th><th>${tt('balance')}</th></tr></thead>
        <tbody>${liabRows}
          <tr><td colspan="2">${tt('currentPeriodPL')} (2314)</td><td class="num credit">${fmtMoney(netIncome)}</td></tr>
        </tbody>
        <tfoot><tr><td colspan="2">${tt('totalLiabEquity')}</td><td class="num credit">${fmtMoney(totalLiabEquity)}</td></tr></tfoot>
      </table>
      <p style="font-size:12.5px;color:var(--muted);margin-top:10px;">
        ${Math.abs(totalAssets-totalLiabEquity)<0.5 ? (currentLang==='ar'?'✅ الميزانية متزنة (الأصول = الخصوم + حقوق الملكية).':'✅ Balanced (Assets = Liabilities + Equity).') : (currentLang==='ar'?'⚠️ فيه فرق بسيط بين الأصول والخصوم وحقوق الملكية — راجع اختيار الحسابات/الفروع أو تأكد إن كل القيود متزنة.':'⚠️ There is a small difference between Assets and Liabilities+Equity — review your account/branch selection or verify all entries are balanced.')}
      </p>
      ${prepReviewFooterHTML(currentUser.username)}
      <div class="no-print" style="margin-top:14px;display:flex;gap:10px;flex-wrap:wrap;">
        ${currentUser.perms.print?`<button class="btn btn-ghost btn-sm" id="bs-preview">${tt('preview')}</button>
        <button class="btn btn-ghost btn-sm" id="bs-pdf">${tt('savePDF')}</button>`:''}
        <button class="btn btn-ghost btn-sm" id="bs-export">${tt('exportExcel')}</button>
      </div>
    </div>
  `;
  document.getElementById('bs-export').addEventListener('click',()=>{
    const rows = excelRows.concat([{'القسم':'خصوم وحقوق ملكية','رقم الحساب':'2314','اسم الحساب':'أرباح/خسائر الفترة الحالية','الرصيد':netIncome.toFixed(2)}]);
    const ws = XLSX.utils.json_to_sheet(rows);
    ws['!cols']=[{wch:16},{wch:10},{wch:26},{wch:14}];
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'المركز المالي');
    XLSX.writeFile(wb, 'قائمة-المركز-المالي.xlsx');
  });
  const previewBtn = document.getElementById('bs-preview');
  if(previewBtn) previewBtn.addEventListener('click', ()=>previewReportModal('bs-report-card', tt('balanceSheetTitle')));
  const pdfBtn = document.getElementById('bs-pdf');
  if(pdfBtn) pdfBtn.addEventListener('click', ()=>exportElementToPDF(document.getElementById('bs-report-card'), 'قائمة-المركز-المالي.pdf'));
}

function classifyCashFlowCategory(counterCode){
  if(!counterCode) return 'تشغيلية';
  if(counterCode.startsWith('121') || counterCode.startsWith('122')) return 'استثمارية';
  if(counterCode.startsWith('214') || counterCode.startsWith('221') || counterCode.startsWith('231')) return 'تمويلية';
  return 'تشغيلية';
}
function renderCashFlow(){

  const cashAccounts = detailAccounts().filter(a=>isCashAccountCode(a.code));
  root.innerHTML = `

            ${cashAccounts.map(a=>`<div class="checkbox-row"><input type="checkbox" class="cf-acc-item" value="${a.code}" id="cf-acc-${a.code}" checked><label for="cf-acc-${a.code}">${a.code} - ${esc(a.name)}</label></div>`).join('')}

          <div style="display:flex;gap:8px;margin-bottom:6px;">
            <button type="button" class="btn btn-ghost btn-sm" id="cf-cc-all">${tt('selectAll')}</button>
            <button type="button" class="btn btn-ghost btn-sm" id="cf-cc-clear">${tt('clearSelection')}</button>
          </div>
          <div id="cf-cc-list" style="max-height:220px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:8px 10px;">${costCenterCheckboxListHTML('cf', currentUser)}</div>
        </div>
      </div>
      <div class="grid grid-2" style="margin-top:14px;">
        <div class="field"><label>${tt('fromDate')}</label><input type="date" id="cf-from"></div>

      <p style="font-size:11px;color:var(--muted);margin-top:8px;">${currentLang==='ar'?'تصنيف تشغيلية/استثمارية/تمويلية بيتم تلقائيًا حسب مجموعة الحساب المقابل لحركة النقدية في نفس القيد — تصنيف مبسّط للمراجعة السريعة، ننصح بمراجعته مع محاسب قبل الاعتماد النهائي.':'Operating/Investing/Financing classification is done automatically based on the counter-account group in the same entry — a simplified classification for quick review; we recommend having an accountant verify it before final sign-off.'}</p>
    </div>
    <div id="cf-result"></div>
